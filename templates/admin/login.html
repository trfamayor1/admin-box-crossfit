<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="manifest" href="/manifest-admin.json">

</head>
<body>
<div class="card">
    <h2>🏋️ Admin Login</h2>
    <input type="email" id="email" placeholder="admin@box.com">
    <button onclick="login()">Entrar</button>
    <p id="msg" class="error"></p>
</div>
<script>
async function login() {
    const email = document.getElementById('email').value;
    const msg = document.getElementById('msg');
    
    if (!email) {
        msg.innerText = "❌ Ingresa tu email";
        return;
    }
    
    msg.innerText = "⏳ Verificando...";
    
    try {
        const response = await fetch('/admin/verificar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Guardar email en localStorage
            localStorage.setItem('admin_email', email);
            window.location.href = '/admin/dashboard';
        } else {
            msg.innerText = "❌ " + data.error;
        }
    } catch (error) {
        msg.innerText = "❌ Error de conexión";
    }
}
</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw-admin.js')
        .then(reg => console.log('✅ SW Admin registrado'))
        .catch(err => console.log('❌ SW Admin error:', err));
}
</script>

</body>
</html>
