<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Admin Box</title>
    <link rel="manifest" href="/ADMIN/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#111; color:white; font-family:Arial; padding:20px; }
        .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:10px; }
        button{ background:#ff4d00; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; }
        .btn{ background:#333; padding:8px 12px; margin:0 2px; }
        .btn-agregar{ background:#00aa55; }
        .btn-eliminar{ background:#ff4444; padding:5px 10px; border-radius:5px; cursor:pointer; }
        .btn-ver{ background:#00aa55; padding:5px 10px; border-radius:5px; }
        table{ width:100%; border-collapse:collapse; margin-top:20px; }
        th, td{ padding:12px; text-align:left; border-bottom:1px solid #333; }
        th{ background:#1e1e1e; }
        .modal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000; }
        .modal-content{ background:#1e1e1e; padding:30px; border-radius:20px; width:90%; max-width:450px; }
        .modal-content input, .modal-content select{ width:100%; padding:10px; margin:8px 0; border-radius:8px; border:none; }
        .cerrar{ float:right; cursor:pointer; font-size:24px; }
        .seccion{ background:#1e1e1e; padding:20px; border-radius:15px; margin-top:30px; }
        .input-group{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .input-group input{ padding:10px; border-radius:8px; border:none; flex:1; }
        h3{ margin-bottom:15px; color:#ff4d00; }
        .success{ background:#00aa55; padding:10px; border-radius:8px; margin-top:10px; display:none; }
        .error{ background:#ff4444; padding:10px; border-radius:8px; margin-top:10px; display:none; }
    </style>
</head>
<body>
<div class="header">
    <h2>🏋️ Panel de Administración</h2>
    <div>
        <button class="btn-agregar" onclick="abrirModalCliente()">+ Nuevo Cliente</button>
        <button onclick="cerrarSesion()">Salir</button>
    </div>
</div>

<!-- Mensajes -->
<div id="successMsg" class="success"></div>
<div id="errorMsg" class="error"></div>

<!-- Sección Clientes -->
<h3>📋 Clientes</h3>
<div style="overflow-x:auto;">
    <table id="tablaClientes">
        <thead>
            <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Celular</th><th>Membresía</th><th>Clases Rest.</th><th>Vencimiento</th><th>Activo</th><th>Acciones</th></tr>
        </thead>
        <tbody id="clientesBody"></tbody>
    </table>
</div>

<!-- Sección Clases -->
<div class="seccion">
    <h3>📅 Crear Clase</h3>
    <div class="input-group">
        <input type="date" id="clase_fecha">
        <input type="time" id="clase_hora">
        <input type="number" id="clase_cupos" placeholder="Cupos" style="width:100px">
        <button onclick="crearClase()">Crear Clase</button>
    </div>
</div>

<div class="seccion">
    <h3>📋 Clases Programadas</h3>
    <div style="overflow-x:auto;">
        <table style="width:100%">
            <thead>
                <tr><th>Fecha</th><th>Hora</th><th>Cupos</th><th>Reservados</th><th>Disponibles</th><th>Acciones</th>
            </thead>
            <tbody id="clasesBody"></tbody>
        </table>
    </div>
</div>

<!-- Sección Anuncios -->
<div class="seccion">
    <h3>📢 Anuncios</h3>
    <div class="input-group">
        <input type="text" id="anuncioTitulo" placeholder="Título" style="flex:2;">
        <input type="text" id="anuncioTexto" placeholder="Texto del anuncio" style="flex:3;">
        <button onclick="crearAnuncio()">Crear Anuncio</button>
    </div>
    <div style="margin-top:20px; overflow-x:auto;">
        <table style="width:100%">
            <thead>
                <tr><th>Título</th><th>Texto</th><th>Fecha</th><th>Vigente</th><th>Acciones</th>
            </thead>
            <tbody id="anunciosBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo">Nuevo Cliente</h3>
        <input type="hidden" id="clienteId">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="celular" placeholder="Celular">
        <input type="text" id="eps" placeholder="EPS">
        <select id="membresiaId"></select>
        <input type="date" id="fechaVencimiento">
        <select id="activo">
            <option value="TRUE">Activo</option>
            <option value="FALSE">Inactivo</option>
        </select>
        <button onclick="guardarCliente()">Guardar</button>
    </div>
</div>

<script>
// ============================================
// VERIFICAR ADMIN
// ============================================
async function verificarAdmin() {
    const adminEmail = localStorage.getItem('admin_email');
    if (!adminEmail) {
        window.location.href = '/admin/login';
        return;
    }
    try {
        const response = await fetch('/admin/verificar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: adminEmail })
        });
        if (!response.ok) {
            localStorage.removeItem('admin_email');
            window.location.href = '/admin/login';
        }
    } catch (error) {
        window.location.href = '/admin/login';
    }
}

function mostrarMensaje(mensaje, tipo) {
    const successDiv = document.getElementById('successMsg');
    const errorDiv = document.getElementById('errorMsg');
    if (tipo === 'success') {
        successDiv.style.display = 'block';
        successDiv.innerHTML = mensaje;
        setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
    } else {
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = mensaje;
        setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
    }
}

// ============================================
// CLIENTES
// ============================================
let clientes = [];
let membresias = [];

async function cargarClientes() {
    const res = await fetch('/admin/clientes');
    clientes = await res.json();
    mostrarClientes();
}

async function cargarMembresias() {
    const res = await fetch('/admin/membresias');
    membresias = await res.json();
    const select = document.getElementById('membresiaId');
    select.innerHTML = '';
    membresias.forEach(m => {
        select.innerHTML += `<option value="${m.id}">${m.nombre} (${m.clases_por_mes} clases/mes - $${m.precio})</option>`;
    });
}

function mostrarClientes() {
    const tbody = document.getElementById('clientesBody');
    tbody.innerHTML = '';
    clientes.forEach(c => {
        const membresia = membresias.find(m => m.id == c.membresia_id);
        tbody.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.nombre || ''}</td>
                <td>${c.email || ''}</td>
                <td>${c.celular || ''}</td>
                <td>${membresia ? membresia.nombre : 'Sin membresía'}</td>
                <td style="color: ${(c.clases_restantes_mes || 0) > 0 ? '#66ff66' : '#ff6666'}">${c.clases_restantes_mes || 0}</td>
                <td>${c.fecha_vencimiento || ''}</td>
                <td>${c.activo == 'TRUE' ? '✅' : '❌'}</td>
                <td>
                    <button onclick="verPerfilCliente('${c.email}')" class="btn-ver" style="background:#00aa55;">👤</button>
                    <button onclick="editarCliente(${c.id})" class="btn">✏️</button>
                    <button onclick="eliminarCliente(${c.id})" class="btn">🗑️</button>
                 </td>
            </table>
        `;
    });
}

function verPerfilCliente(email) {
    window.location.href = `/admin/cliente_perfil?email=${encodeURIComponent(email)}`;
}

function abrirModalCliente() {
    document.getElementById('modalTitulo').innerText = 'Nuevo Cliente';
    document.getElementById('clienteId').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('email').value = '';
    document.getElementById('celular').value = '';
    document.getElementById('eps').value = '';
    document.getElementById('fechaVencimiento').value = '';
    document.getElementById('activo').value = 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function editarCliente(id) {
    const cliente = clientes.find(c => c.id == id);
    if (!cliente) return;
    document.getElementById('modalTitulo').innerText = 'Editar Cliente';
    document.getElementById('clienteId').value = cliente.id;
    document.getElementById('nombre').value = cliente.nombre || '';
    document.getElementById('email').value = cliente.email || '';
    document.getElementById('celular').value = cliente.celular || '';
    document.getElementById('eps').value = cliente.eps || '';
    document.getElementById('membresiaId').value = cliente.membresia_id || '';
    document.getElementById('fechaVencimiento').value = cliente.fecha_vencimiento || '';
    document.getElementById('activo').value = cliente.activo || 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function cerrarModal() {
    document.getElementById('modalCliente').style.display = 'none';
}

async function guardarCliente() {
    const id = document.getElementById('clienteId').value;
    const datos = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        celular: document.getElementById('celular').value,
        eps: document.getElementById('eps').value,
        membresia_id: document.getElementById('membresiaId').value,
        fecha_vencimiento: document.getElementById('fechaVencimiento').value,
        activo: document.getElementById('activo').value,
        foto_url: ''
    };
    
    let res;
    try {
        if (id) {
            res = await fetch(`/admin/clientes/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        } else {
            res = await fetch('/admin/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        }
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'success');
            cerrarModal();
            cargarClientes();
        } else {
            mostrarMensaje(data.error || 'Error al guardar', 'error');
        }
    } catch (error) {
        mostrarMensaje('Error de conexión', 'error');
    }
}

async function eliminarCliente(id) {
    if (confirm('¿Eliminar este cliente?')) {
        const res = await fetch(`/admin/clientes/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'success');
            cargarClientes();
        } else {
            mostrarMensaje(data.error || 'Error al eliminar', 'error');
        }
    }
}

// ============================================
// CLASES
// ============================================
async function crearClase() {
    const fecha = document.getElementById('clase_fecha').value;
    const hora = document.getElementById('clase_hora').value;
    const cupos = document.getElementById('clase_cupos').value;
    
    if (!fecha || !hora || !cupos) {
        mostrarMensaje("Completa todos los campos", 'error');
        return;
    }
    
    const res = await fetch('/admin/clases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, hora, cupos_maximos: parseInt(cupos) })
    });
    
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        cargarClases();
        document.getElementById('clase_fecha').value = '';
        document.getElementById('clase_hora').value = '';
        document.getElementById('clase_cupos').value = '';
    } else {
        mostrarMensaje(data.error || 'Error al crear clase', 'error');
    }
}

async function cargarClases() {
    const res = await fetch('/admin/clases');
    const clases = await res.json();
    const tbody = document.getElementById('clasesBody');
    tbody.innerHTML = '';
    
    clases.forEach(c => {
        const disponibles = (c.cupos_maximos || 0) - (c.cupos_ocupados || 0);
        tbody.innerHTML += `
            <tr>
                <td>${c.fecha}</td>
                <td>${c.hora}</td>
                <td>${c.cupos_maximos}</td>
                <td>${c.cupos_ocupados || 0}</td>
                <td style="color: ${disponibles > 0 ? '#66ff66' : '#ff6666'}">${disponibles}</td>
                <td>
                    <button onclick="eliminarClase(${c.id})" class="btn-eliminar">🗑️ Eliminar</button>
                 </td>
            </tr>
        `;
    });
}

async function eliminarClase(id) {
    if (confirm('¿Eliminar esta clase?')) {
        const res = await fetch(`/admin/clases/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'success');
            cargarClases();
        } else {
            mostrarMensaje(data.error || 'Error al eliminar', 'error');
        }
    }
}

// ============================================
// ANUNCIOS
// ============================================
async function cargarAnuncios() {
    const res = await fetch('/admin/anuncios');
    const anuncios = await res.json();
    const tbody = document.getElementById('anunciosBody');
    tbody.innerHTML = '';
    
    anuncios.forEach(a => {
        tbody.innerHTML += `
            <tr>
                <td><strong>${a.titulo || ''}</strong></td>
                <td>${a.texto || ''}</td>
                <td>${a.fecha_publicacion || ''}</td>
                <td>
                    <button onclick="toggleAnuncio(${a.id}, '${a.vigente}')" 
                        style="background: ${a.vigente == 'TRUE' ? '#00aa55' : '#ff4444'}; padding:5px 10px;">
                        ${a.vigente == 'TRUE' ? '✅ Activo' : '❌ Inactivo'}
                    </button>
                 </td>
                <td>
                    <button onclick="eliminarAnuncio(${a.id})" class="btn-eliminar">🗑️ Eliminar</button>
                 </td>
            </tr>
        `;
    });
}

async function crearAnuncio() {
    const titulo = document.getElementById('anuncioTitulo').value;
    const texto = document.getElementById('anuncioTexto').value;
    
    if (!titulo || !texto) {
        mostrarMensaje("Completa título y texto", 'error');
        return;
    }
    
    const res = await fetch('/admin/anuncios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo, texto })
    });
    
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        document.getElementById('anuncioTitulo').value = '';
        document.getElementById('anuncioTexto').value = '';
        cargarAnuncios();
    } else {
        mostrarMensaje(data.error, 'error');
    }
}

async function toggleAnuncio(id, vigenteActual) {
    const nuevaVigencia = vigenteActual == 'TRUE' ? 'FALSE' : 'TRUE';
    
    try {
        const res = await fetch(`/admin/anuncios/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vigente: nuevaVigencia })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'success');
            cargarAnuncios();
        } else {
            mostrarMensaje(data.error || 'Error al actualizar', 'error');
        }
    } catch (error) {
        mostrarMensaje('Error de conexión', 'error');
    }
}

async function eliminarAnuncio(id) {
    if (confirm('¿Eliminar este anuncio?')) {
        const res = await fetch(`/admin/anuncios/${id}`, { method: 'DELETE' });
        if (res.ok) {
            mostrarMensaje('Anuncio eliminado', 'success');
            cargarAnuncios();
        } else {
            mostrarMensaje('Error al eliminar', 'error');
        }
    }
}

// ============================================
// CERRAR SESIÓN
// ============================================
function cerrarSesion() {
    localStorage.removeItem('admin_email');
    window.location.href = '/admin/login';
}

// ============================================
// INICIALIZAR
// ============================================
verificarAdmin().then(() => {
    cargarMembresias();
    cargarClientes();
    cargarClases();
    cargarAnuncios();
});
</script>
</body>
</html>
