<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Machine Box Admin</title>
    <link rel="manifest" href="/ADMIN/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        /* Estilos para clientes en acordeón */
        .clientes-container {
            margin-top: 20px;
        }
        
        .cliente-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all var(--transition-normal);
        }
        
        .cliente-item:hover {
            border-color: var(--border-glow);
        }
        
        .cliente-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: all var(--transition-fast);
        }
        
        .cliente-header:hover {
            background: rgba(240, 233, 29, 0.05);
        }
        
        .cliente-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .cliente-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--bg-primary);
            font-size: 18px;
        }
        
        .cliente-nombre {
            font-weight: 600;
            font-size: 16px;
        }
        
        .cliente-email {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .cliente-estado {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .cliente-estado.inactivo {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }
        
        .cliente-toggle {
            color: var(--primary);
            transition: transform var(--transition-fast);
        }
        
        .cliente-toggle.abierto {
            transform: rotate(180deg);
        }
        
        .cliente-body {
            display: none;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }
        
        .cliente-body.abierto {
            display: block;
        }
        
        /* Detalle del cliente en DOS COLUMNAS */
        .cliente-detalle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .detalle-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
        }
        
        .detalle-label {
            font-weight: 600;
            color: var(--primary);
        }
        
        .detalle-valor {
            color: var(--text-primary);
        }
        
        .cliente-acciones {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        
        /* Estilos para clases en acordeón */
        .clases-container {
            margin-top: 20px;
        }
        
        .clase-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all var(--transition-normal);
        }
        
        .clase-item:hover {
            border-color: var(--border-glow);
        }
        
        .clase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: all var(--transition-fast);
        }
        
        .clase-header:hover {
            background: rgba(240, 233, 29, 0.05);
        }
        
        .clase-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .clase-fecha {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .clase-hora {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .clase-cupos {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .clase-cupos.lleno {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }
        
        .clase-toggle {
            color: var(--primary);
            transition: transform var(--transition-fast);
        }
        
        .clase-toggle.abierto {
            transform: rotate(180deg);
        }
        
        .clase-body {
            display: none;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }
        
        .clase-body.abierto {
            display: block;
        }
        
        .clase-detalle {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .clase-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        
        /* Estilos generales */
        .seccion {
            background: var(--bg-surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .input-group input {
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-primary);
            flex: 1;
        }
        
        .radio-group {
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
        }
        
        .radio-group label {
            cursor: pointer;
        }
        
        .dias-semana {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: var(--radius-md);
        }
        
        .dias-semana label {
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            transition: all var(--transition-fast);
        }
        
        .dias-semana label:hover {
            background: var(--primary);
            color: var(--bg-primary);
        }
        
        .btn-ver {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-ver:hover {
            background: var(--primary);
            color: var(--bg-primary);
        }
        
        .btn-editar {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            cursor: pointer;
        }
        
        .btn-eliminar {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            cursor: pointer;
        }
        
        .btn-agregar {
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 700;
            cursor: pointer;
        }
        
        .btn-salir {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-salir:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: none;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        
        .stat-card i {
            font-size: 2rem;
            color: var(--primary);
        }
        
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }
        
        .buscador-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .buscador-input {
            padding: 10px 15px;
            width: 250px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-primary);
        }
        
        @media (max-width: 768px) {
            .cliente-info, .clase-info {
                flex: 1;
            }
            .cliente-detalle {
                grid-template-columns: 1fr;
            }
            .cliente-header, .clase-header {
                flex-wrap: wrap;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group input, .input-group button {
                width: 100%;
            }
            .dias-semana {
                justify-content: center;
            }
            .buscador-container {
                width: 100%;
            }
            .buscador-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-dumbbell" style="color: var(--primary);"></i> Machine Box Admin</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn-agregar" onclick="abrirModalCliente()"><i class="fas fa-user-plus"></i> Nuevo Cliente</button>
            <button onclick="cerrarSesion()" class="btn-salir"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </div>
    </div>

    <!-- Tarjetas de estadísticas -->
    <div class="stats-cards">
        <div class="stat-card">
            <i class="fas fa-users"></i>
            <div class="value" id="totalClientes">0</div>
            <div>Total Clientes</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-calendar-check"></i>
            <div class="value" id="totalClasesActivas">0</div>
            <div>Clases Activas</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-bullhorn"></i>
            <div class="value" id="totalAnuncios">0</div>
            <div>Anuncios</div>
        </div>
    </div>

    <!-- Sección Clientes - Estilo Acordeón con Buscador -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
        <h3><i class="fas fa-users" style="color: var(--primary);"></i> Clientes</h3>
        <div class="buscador-container">
            <input type="text" id="buscadorClientes" class="buscador-input" placeholder="Nombre, email o celular...">
            <button id="btnBuscar" class="btn-agregar"><i class="fas fa-search"></i> Buscar</button>
            <button id="btnLimpiar" class="btn-salir"><i class="fas fa-times"></i> Limpiar</button>
        </div>
    </div>
    <div id="clientesContainer" class="clientes-container">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-pulse"></i>
            <p>Cargando clientes...</p>
        </div>
    </div>

    <!-- Sección Clases -->
    <div class="seccion">
        <h3><i class="fas fa-calendar-alt" style="color: var(--primary);"></i> Crear Clase</h3>
        
        <div class="radio-group">
            <label>
                <input type="radio" name="tipoClase" value="simple" checked onchange="toggleModoClase()"> Clase única
            </label>
            <label>
                <input type="radio" name="tipoClase" value="multiple" onchange="toggleModoClase()"> Clase múltiple
            </label>
        </div>
        
        <!-- Modo simple (una fecha) -->
        <div id="modoSimple" class="input-group">
            <input type="date" id="clase_fecha">
            <input type="time" id="clase_hora">
            <input type="number" id="clase_cupos" placeholder="Cupos" style="width:100px">
            <button onclick="crearClase()" class="btn-agregar"><i class="fas fa-plus"></i> Crear Clase</button>
        </div>
        
        <!-- Modo múltiple (próximos 7 días) -->
        <div id="modoMultiple" style="display: none;">
            <div class="input-group" style="margin-bottom: 15px;">
                <input type="time" id="clase_hora_multiple" placeholder="Hora">
                <input type="number" id="clase_cupos_multiple" placeholder="Cupos" style="width:100px">
            </div>
            <div style="margin: 15px 0;">
                <p style="margin-bottom: 10px; color: var(--text-secondary);">📅 Selecciona los días para programar (próximos 7 días):</p>
                <div class="dias-semana" id="diasContainer"></div>
            </div>
            <button onclick="crearClasesMultiples()" class="btn-agregar"><i class="fas fa-calendar-week"></i> Crear Clases</button>
        </div>
    </div>

    <!-- Sección Clases Programadas - Estilo Acordeón -->
    <div class="seccion">
        <h3><i class="fas fa-list" style="color: var(--primary);"></i> Clases Programadas</h3>
        <div id="clasesContainer" class="clases-container">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-pulse"></i>
                <p>Cargando clases...</p>
            </div>
        </div>
    </div>

    <!-- Sección Anuncios -->
    <div class="seccion">
        <h3><i class="fas fa-bullhorn" style="color: var(--primary);"></i> Anuncios</h3>
        <div class="input-group">
            <input type="text" id="anuncioTitulo" placeholder="Título">
            <input type="text" id="anuncioTexto" placeholder="Texto del anuncio">
            <button onclick="crearAnuncio()" class="btn-agregar"><i class="fas fa-plus"></i> Crear Anuncio</button>
        </div>
        <div style="margin-top:20px; overflow-x:auto;">
            <table style="width:100%">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Texto</th>
                        <th>Fecha</th>
                        <th>Vigente</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="anunciosBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo"><i class="fas fa-user"></i> Nuevo Cliente</h3>
        <input type="hidden" id="clienteId">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="celular" placeholder="Celular">
        <input type="text" id="eps" placeholder="EPS">
        <input type="number" id="clasesRestantes" placeholder="Clases restantes" step="1" min="0">
        <select id="membresiaId"></select>
        <input type="date" id="fechaVencimiento">
        <select id="activo">
            <option value="TRUE">Activo</option>
            <option value="FALSE">Inactivo</option>
        </select>
        <button onclick="guardarCliente()" class="btn-agregar" style="width:100%; margin-top:15px;"><i class="fas fa-save"></i> Guardar</button>
    </div>
</div>

<script>
// ============================================
// VERIFICAR ADMIN
// ============================================
async function verificarAdmin() {
    const adminEmail = localStorage.getItem('admin_email');
    if (!adminEmail) {
        window.location.href = '/admin/login';
        return;
    }
    try {
        const response = await fetch('/admin/verificar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: adminEmail })
        });
        if (!response.ok) {
            localStorage.removeItem('admin_email');
            window.location.href = '/admin/login';
        }
    } catch (error) {
        window.location.href = '/admin/login';
    }
}

function mostrarMensaje(mensaje, tipo) {
    const toast = document.createElement('div');
    toast.className = tipo === 'success' ? 'success' : 'error';
    toast.innerHTML = mensaje;
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.zIndex = '2000';
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
}

// ============================================
// CLIENTES - ACORDEÓN CON BUSCADOR
// ============================================
let todosLosClientes = [];
let clientesFiltrados = [];
let membresias = [];

function safeToLowerCase(valor) {
    if (!valor) return '';
    return String(valor).toLowerCase();
}

function buscarClientes() {
    const busqueda = document.getElementById('buscadorClientes').value.toLowerCase().trim();
    
    if (!busqueda) {
        clientesFiltrados = [...todosLosClientes];
    } else {
        clientesFiltrados = todosLosClientes.filter(cliente => {
            const nombre = safeToLowerCase(cliente.nombre);
            const email = safeToLowerCase(cliente.email);
            const celular = safeToLowerCase(cliente.celular);
            return nombre.includes(busqueda) || email.includes(busqueda) || celular.includes(busqueda);
        });
    }
    
    mostrarClientesFiltrados();
    actualizarEstadisticas();
    
    if (clientesFiltrados.length === 0 && busqueda) {
        mostrarMensaje(`No se encontraron clientes con: "${busqueda}"`, 'error');
    }
}

function limpiarBusqueda() {
    document.getElementById('buscadorClientes').value = '';
    clientesFiltrados = [...todosLosClientes];
    mostrarClientesFiltrados();
    actualizarEstadisticas();
    mostrarMensaje('Búsqueda limpiada', 'success');
}

function mostrarClientesFiltrados() {
    const container = document.getElementById('clientesContainer');
    container.innerHTML = '';
    
    if (!clientesFiltrados || clientesFiltrados.length === 0) {
        container.innerHTML = '<div class="card" style="text-align: center;"><p>No hay clientes para mostrar</p></div>';
        return;
    }
    
    clientesFiltrados.forEach(cliente => {
        const membresia = (membresias || []).find(m => m.id == cliente.membresia_id);
        const estadoClass = cliente.activo == 'TRUE' ? 'activo' : 'inactivo';
        const estadoText = cliente.activo == 'TRUE' ? '✅ Activo' : '❌ Inactivo';
        const nombreCompleto = cliente.nombre || 'Cliente';
        const iniciales = nombreCompleto.split(' ').map(p => p[0]).join('').toUpperCase().substring(0, 2);
        
        container.innerHTML += `
            <div class="cliente-item" id="cliente-${cliente.id}">
                <div class="cliente-header" onclick="toggleCliente(${cliente.id})">
                    <div class="cliente-info">
                        <div class="cliente-avatar">${iniciales}</div>
                        <div>
                            <div class="cliente-nombre">${cliente.nombre || 'Sin nombre'}</div>
                            <div class="cliente-email">${cliente.email || 'Sin email'}</div>
                        </div>
                        <div class="cliente-estado ${estadoClass}">${estadoText}</div>
                    </div>
                    <div class="cliente-toggle" id="toggle-${cliente.id}">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="cliente-body" id="body-${cliente.id}">
                    <div class="cliente-detalle">
                        <div class="detalle-item">
                            <span class="detalle-label">ID</span>
                            <span class="detalle-valor">${cliente.id}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label">Celular</span>
                            <span class="detalle-valor">${cliente.celular || 'No registrado'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label">EPS</span>
                            <span class="detalle-valor">${cliente.eps || 'No registrado'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label">Membresía</span>
                            <span class="detalle-valor">${membresia ? membresia.nombre : 'Sin membresía'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label">Clases Rest.</span>
                            <span class="detalle-valor" style="color: ${(cliente.clases_restantes_mes || 0) > 0 ? '#10b981' : '#dc2626'}">${cliente.clases_restantes_mes || 0}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label">Vencimiento</span>
                            <span class="detalle-valor">${cliente.fecha_vencimiento || 'No registrado'}</span>
                        </div>
                    </div>
                    <div class="cliente-acciones">
                        <button class="btn-ver" onclick="verPerfilCliente('${cliente.email}')"><i class="fas fa-eye"></i> Ver Perfil</button>
                        <button class="btn-editar" onclick="editarCliente(${cliente.id})"><i class="fas fa-edit"></i> Editar</button>
                        <button class="btn-eliminar" onclick="eliminarCliente(${cliente.id})"><i class="fas fa-trash"></i> Eliminar</button>
                    </div>
                </div>
            </div>
        `;
    });
}

function toggleCliente(id) {
    document.getElementById(`body-${id}`).classList.toggle('abierto');
    document.getElementById(`toggle-${id}`).classList.toggle('abierto');
}

function actualizarEstadisticas() {
    document.getElementById('totalClientes').innerText = clientesFiltrados.length;
}

function verPerfilCliente(email) {
    window.location.href = `/admin/cliente_perfil?email=${encodeURIComponent(email)}`;
}

async function cargarMembresias() {
    const res = await fetch('/admin/membresias');
    membresias = await res.json();
    const select = document.getElementById('membresiaId');
    select.innerHTML = '';
    membresias.forEach(m => {
        select.innerHTML += `<option value="${m.id}">${m.nombre} (${m.clases_por_mes} clases/mes)</option>`;
    });
}

async function cargarClientes() {
    const container = document.getElementById('clientesContainer');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i><p>Cargando clientes...</p></div>';
    
    const res = await fetch('/admin/clientes');
    todosLosClientes = await res.json();
    clientesFiltrados = [...todosLosClientes];
    mostrarClientesFiltrados();
    actualizarEstadisticas();
}

function abrirModalCliente() {
    document.getElementById('modalTitulo').innerHTML = '<i class="fas fa-user-plus"></i> Nuevo Cliente';
    document.getElementById('clienteId').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('email').value = '';
    document.getElementById('celular').value = '';
    document.getElementById('eps').value = '';
    document.getElementById('clasesRestantes').value = 0;
    document.getElementById('membresiaId').value = '';
    document.getElementById('fechaVencimiento').value = '';
    document.getElementById('activo').value = 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function editarCliente(id) {
    const cliente = todosLosClientes.find(c => c.id == id);
    if (!cliente) {
        mostrarMensaje("Cliente no encontrado", 'error');
        return;
    }
    
    document.getElementById('modalTitulo').innerHTML = '<i class="fas fa-user-edit"></i> Editar Cliente';
    document.getElementById('clienteId').value = cliente.id;
    document.getElementById('nombre').value = cliente.nombre || '';
    document.getElementById('email').value = cliente.email || '';
    document.getElementById('celular').value = cliente.celular || '';
    document.getElementById('eps').value = cliente.eps || '';
    document.getElementById('clasesRestantes').value = cliente.clases_restantes_mes || 0;
    document.getElementById('membresiaId').value = cliente.membresia_id || '';
    document.getElementById('fechaVencimiento').value = cliente.fecha_vencimiento || '';
    document.getElementById('activo').value = cliente.activo || 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function cerrarModal() {
    document.getElementById('modalCliente').style.display = 'none';
}

async function guardarCliente() {
    const id = document.getElementById('clienteId').value;
    const datos = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        celular: document.getElementById('celular').value,
        eps: document.getElementById('eps').value,
        clases_restantes_mes: parseInt(document.getElementById('clasesRestantes').value) || 0,
        membresia_id: document.getElementById('membresiaId').value,
        fecha_vencimiento: document.getElementById('fechaVencimiento').value,
        activo: document.getElementById('activo').value,
        foto_url: ''
    };
    
    let res;
    try {
        if (id) {
            res = await fetch(`/admin/clientes/${parseInt(id)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        } else {
            res = await fetch('/admin/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        }
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'success');
            cerrarModal();
            cargarClientes();
        } else {
            mostrarMensaje(data.error || 'Error al guardar', 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        mostrarMensaje('Error de conexión', 'error');
    }
}

async function eliminarCliente(id) {
    const res = await fetch(`/admin/clientes/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        cargarClientes();
    } else {
        mostrarMensaje(data.error || 'Error al eliminar', 'error');
    }
}

// ============================================
// CLASES - MODO SIMPLE Y MÚLTIPLE
// ============================================
function toggleModoClase() {
    const modo = document.querySelector('input[name="tipoClase"]:checked').value;
    const modoSimple = document.getElementById('modoSimple');
    const modoMultiple = document.getElementById('modoMultiple');
    
    if (modo === 'simple') {
        modoSimple.style.display = 'flex';
        modoMultiple.style.display = 'none';
    } else {
        modoSimple.style.display = 'none';
        modoMultiple.style.display = 'block';
        cargarDiasSemana();
    }
}

function obtenerNombreDia(dia) {
    const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    return dias[dia];
}

function cargarDiasSemana() {
    const container = document.getElementById('diasContainer');
    const hoy = new Date();
    const dias = [];
    
    for (let i = 0; i < 7; i++) {
        let fecha = new Date(hoy);
        fecha.setDate(hoy.getDate() + i);
        const nombreDia = obtenerNombreDia(fecha.getDay());
        const esHoy = (i === 0);
        dias.push({
            nombre: nombreDia,
            esHoy: esHoy,
            fecha: fecha.toISOString().split('T')[0]
        });
    }
    
    container.innerHTML = '';
    dias.forEach(d => {
        container.innerHTML += `
            <label>
                <input type="checkbox" value="${d.nombre}"> ${d.nombre.charAt(0).toUpperCase() + d.nombre.slice(1)} ${d.esHoy ? '(hoy)' : ''}
            </label>
        `;
    });
}

async function crearClase() {
    const fecha = document.getElementById('clase_fecha').value;
    const hora = document.getElementById('clase_hora').value;
    const cupos = document.getElementById('clase_cupos').value;
    
    if (!fecha || !hora || !cupos) {
        mostrarMensaje("Completa todos los campos", 'error');
        return;
    }
    
    const res = await fetch('/admin/clases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, hora, cupos_maximos: parseInt(cupos) })
    });
    
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        cargarClases();
        document.getElementById('clase_fecha').value = '';
        document.getElementById('clase_hora').value = '';
        document.getElementById('clase_cupos').value = '';
    } else {
        mostrarMensaje(data.error || 'Error al crear clase', 'error');
    }
}

async function crearClasesMultiples() {
    const hora = document.getElementById('clase_hora_multiple').value;
    const cupos = document.getElementById('clase_cupos_multiple').value;
    
    if (!hora || !cupos) {
        mostrarMensaje("Completa hora y cupos", 'error');
        return;
    }
    
    const diasSeleccionados = [];
    document.querySelectorAll('#diasContainer input[type="checkbox"]:checked').forEach(cb => {
        diasSeleccionados.push(cb.value);
    });
    
    if (diasSeleccionados.length === 0) {
        mostrarMensaje("Selecciona al menos un día", 'error');
        return;
    }
    
    const hoy = new Date();
    const fechas = [];
    
    for (let i = 0; i < 7; i++) {
        let fecha = new Date(hoy);
        fecha.setDate(hoy.getDate() + i);
        const nombreDia = obtenerNombreDia(fecha.getDay());
        if (diasSeleccionados.includes(nombreDia)) {
            fechas.push(fecha.toISOString().split('T')[0]);
        }
    }
    
    if (fechas.length === 0) {
        mostrarMensaje("No hay fechas en los días seleccionados", 'error');
        return;
    }
    
    let creadas = 0;
    let errores = 0;
    
    for (const fecha of fechas) {
        try {
            const res = await fetch('/admin/clases', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fecha, hora, cupos_maximos: parseInt(cupos) })
            });
            if (res.ok) {
                creadas++;
            } else {
                errores++;
            }
        } catch (error) {
            errores++;
        }
    }
    
    mostrarMensaje(`✅ ${creadas} clases creadas. ${errores > 0 ? `❌ ${errores} errores.` : ''}`, creadas > 0 ? 'success' : 'error');
    
    if (creadas > 0) {
        cargarClases();
        document.getElementById('clase_hora_multiple').value = '';
        document.getElementById('clase_cupos_multiple').value = '';
        document.querySelectorAll('#diasContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
    }
}

async function cargarClases() {
    const container = document.getElementById('clasesContainer');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i><p>Cargando clases...</p></div>';
    
    const res = await fetch('/admin/clases');
    const clases = await res.json();
    
    document.getElementById('totalClasesActivas').innerText = clases.length;
    
    container.innerHTML = '';
    
    if (clases.length === 0) {
        container.innerHTML = '<div class="card" style="text-align: center;"><p>No hay clases programadas</p></div>';
        return;
    }
    
    clases.forEach(c => {
        const disponibles = (c.cupos_maximos || 0) - (c.cupos_ocupados || 0);
        container.innerHTML += `
            <div class="clase-item" id="clase-${c.id}">
                <div class="clase-header" onclick="toggleClase(${c.id})">
                    <div class="clase-info">
                        <div class="clase-fecha"><i class="fas fa-calendar-day"></i> ${c.fecha || 'Sin fecha'}</div>
                        <div class="clase-hora"><i class="fas fa-clock"></i> ${c.hora || 'Sin hora'}</div>
                        <div class="clase-cupos ${disponibles <= 0 ? 'lleno' : ''}"><i class="fas fa-users"></i> ${disponibles > 0 ? `${disponibles} cupos disponibles` : 'Sin cupos'}</div>
                    </div>
                    <div class="clase-toggle" id="clase-toggle-${c.id}"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="clase-body" id="clase-body-${c.id}">
                    <div class="clase-detalle">
                        <div class="detalle-item"><span class="detalle-label"><i class="fas fa-id-card"></i> ID</span><span class="detalle-valor">${c.id}</span></div>
                        <div class="detalle-item"><span class="detalle-label"><i class="fas fa-users"></i> Cupos totales</span><span class="detalle-valor">${c.cupos_maximos || 0}</span></div>
                        <div class="detalle-item"><span class="detalle-label"><i class="fas fa-user-check"></i> Reservados</span><span class="detalle-valor">${c.cupos_ocupados || 0}</span></div>
                        <div class="detalle-item"><span class="detalle-label"><i class="fas fa-chart-line"></i> Disponibles</span><span class="detalle-valor" style="color: ${disponibles > 0 ? '#10b981' : '#dc2626'}">${disponibles}</span></div>
                    </div>
                    <div class="clase-acciones">
                        <button class="btn-eliminar" onclick="eliminarClase(${c.id})"><i class="fas fa-trash"></i> Eliminar clase</button>
                    </div>
                </div>
            </div>
        `;
    });
}

function toggleClase(id) {
    document.getElementById(`clase-body-${id}`).classList.toggle('abierto');
    document.getElementById(`clase-toggle-${id}`).classList.toggle('abierto');
}

async function eliminarClase(id) {
    const res = await fetch(`/admin/clases/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        cargarClases();
    } else {
        mostrarMensaje(data.error || 'Error al eliminar', 'error');
    }
}

// ============================================
// ANUNCIOS
// ============================================
async function cargarAnuncios() {
    const res = await fetch('/admin/anuncios');
    const anuncios = await res.json();
    const tbody = document.getElementById('anunciosBody');
    tbody.innerHTML = '';
    
    document.getElementById('totalAnuncios').innerText = anuncios.length;
    
    anuncios.forEach(a => {
        tbody.innerHTML += `
            <tr>
                <td data-label="Título"><strong>${a.titulo || ''}</strong></td>
                <td data-label="Texto">${a.texto || ''}</td>
                <td data-label="Fecha">${a.fecha_publicacion || ''}</td>
                <td data-label="Vigente">
                    <button onclick="toggleAnuncio(${a.id}, '${a.vigente}')" 
                        style="background: ${a.vigente == 'TRUE' ? '#10b981' : '#dc2626'}; padding:5px 10px; border-radius:20px;">
                        ${a.vigente == 'TRUE' ? '✅ Activo' : '❌ Inactivo'}
                    </button>
                </td>
                <td data-label="Acciones">
                    <button class="btn-eliminar" onclick="eliminarAnuncio(${a.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
}

async function crearAnuncio() {
    const titulo = document.getElementById('anuncioTitulo').value;
    const texto = document.getElementById('anuncioTexto').value;
    
    if (!titulo || !texto) {
        mostrarMensaje("Completa título y texto", 'error');
        return;
    }
    
    const res = await fetch('/admin/anuncios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo, texto })
    });
    
    const data = await res.json();
    if (res.ok) {
        mostrarMensaje(data.mensaje, 'success');
        document.getElementById('anuncioTitulo').value = '';
        document.getElementById('anuncioTexto').value = '';
        cargarAnuncios();
    } else {
        mostrarMensaje(data.error, 'error');
    }
}

async function toggleAnuncio(id, vigenteActual) {
    const nuevaVigencia = vigenteActual == 'TRUE' ? 'FALSE' : 'TRUE';
    
    try {
        const res = await fetch(`/admin/anuncios/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vigente: nuevaVigencia })
        });
        
        if (res.ok) {
            mostrarMensaje('Anuncio actualizado', 'success');
            cargarAnuncios();
        } else {
            mostrarMensaje('Error al actualizar', 'error');
        }
    } catch (error) {
        mostrarMensaje('Error de conexión', 'error');
    }
}

async function eliminarAnuncio(id) {
    const res = await fetch(`/admin/anuncios/${id}`, { method: 'DELETE' });
    if (res.ok) {
        mostrarMensaje('Anuncio eliminado', 'success');
        cargarAnuncios();
    } else {
        mostrarMensaje('Error al eliminar', 'error');
    }
}
