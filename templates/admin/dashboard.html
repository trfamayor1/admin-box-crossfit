<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Admin Box</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#111; color:white; font-family:Arial; padding:20px; }
        .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:10px; }
        button{ background:#ff4d00; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; }
        .btn{ background:#333; }
        .btn-agregar{ background:#00aa55; }
        table{ width:100%; border-collapse:collapse; margin-top:20px; }
        th, td{ padding:12px; text-align:left; border-bottom:1px solid #333; }
        th{ background:#1e1e1e; }
        .modal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
        .modal-content{ background:#1e1e1e; padding:30px; border-radius:20px; width:90%; max-width:450px; }
        .modal-content input, .modal-content select{ width:100%; padding:10px; margin:8px 0; border-radius:8px; border:none; }
        .cerrar{ float:right; cursor:pointer; font-size:24px; }
    </style>
</head>
<body>
<div class="header">
    <h2>🏋️ Panel de Administración</h2>
    <div>
        <button class="btn-agregar" onclick="abrirModalCliente()">+ Nuevo Cliente</button>
        <button onclick="cerrarSesion()">Salir</button>
    </div>
</div>

<h3>📋 Clientes</h3>
<div style="overflow-x:auto;">
    <table id="tablaClientes">
        <thead>
            <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Celular</th><th>Membresía</th><th>Vencimiento</th><th>Activo</th><th>Acciones</th></tr>
        </thead>
        <tbody id="clientesBody"></tbody>
    </table>
</div>

<!-- Modal Crear/Editar Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo">Nuevo Cliente</h3>
        <input type="hidden" id="clienteId">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="celular" placeholder="Celular">
        <input type="text" id="eps" placeholder="EPS">
        <select id="membresiaId"></select>
        <input type="date" id="fechaVencimiento">
        <select id="activo">
            <option value="TRUE">Activo</option>
            <option value="FALSE">Inactivo</option>
        </select>
        <button onclick="guardarCliente()">Guardar</button>
    </div>
</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}

let clientes = [];
let membresias = [];

async function verificarSesion() {
    try {
        const res = await fetch('/verificar_sesion');
        if (!res.ok) window.location.href = '/';
    } catch(e) {
        window.location.href = '/';
    }
}

async function cargarClientes() {
    const res = await fetch('/clientes');
    clientes = await res.json();
    mostrarClientes();
}

async function cargarMembresias() {
    const res = await fetch('/membresias');
    membresias = await res.json();
    const select = document.getElementById('membresiaId');
    select.innerHTML = '';
    membresias.forEach(m => {
        select.innerHTML += `<option value="${m.id}">${m.nombre}</option>`;
    });
}

function mostrarClientes() {
    const tbody = document.getElementById('clientesBody');
    tbody.innerHTML = '';
    clientes.forEach(c => {
        tbody.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.nombre || ''}</td>
                <td>${c.email || ''}</td>
                <td>${c.celular || ''}</td>
                <td>${c.membresia_nombre || buscarMembresiaNombre(c.membresia_id)}</td>
                <td>${c.fecha_vencimiento || ''}</td>
                <td>${c.activo == 'TRUE' ? '✅' : '❌'}</td>
                <td>
                    <button onclick="editarCliente(${c.id})" class="btn">✏️</button>
                    <button onclick="eliminarCliente(${c.id})" class="btn">🗑️</button>
                </td>
            </tr>
        `;
    });
}

function buscarMembresiaNombre(id) {
    const m = membresias.find(m => m.id == id);
    return m ? m.nombre : 'Sin membresía';
}

function abrirModalCliente() {
    document.getElementById('modalTitulo').innerText = 'Nuevo Cliente';
    document.getElementById('clienteId').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('email').value = '';
    document.getElementById('celular').value = '';
    document.getElementById('eps').value = '';
    document.getElementById('fechaVencimiento').value = '';
    document.getElementById('activo').value = 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function editarCliente(id) {
    const cliente = clientes.find(c => c.id == id);
    if (!cliente) return;
    document.getElementById('modalTitulo').innerText = 'Editar Cliente';
    document.getElementById('clienteId').value = cliente.id;
    document.getElementById('nombre').value = cliente.nombre || '';
    document.getElementById('email').value = cliente.email || '';
   document.getElementById('celular').value = cliente.celular || '';
    document.getElementById('eps').value = cliente.eps || '';
    document.getElementById('membresiaId').value = cliente.membresia_id || '';
    document.getElementById('fechaVencimiento').value = cliente.fecha_vencimiento || '';
    document.getElementById('activo').value = cliente.activo || 'TRUE';
    document.getElementById('modalCliente').style.display = 'flex';
}

function cerrarModal() {
    document.getElementById('modalCliente').style.display = 'none';
}

async function guardarCliente() {
    const id = document.getElementById('clienteId').value;
    const datos = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        celular: document.getElementById('celular').value,
        eps: document.getElementById('eps').value,
        membresia_id: document.getElementById('membresiaId').value,
        fecha_vencimiento: document.getElementById('fechaVencimiento').value,
        activo: document.getElementById('activo').value,
        clases_restantes_mes: 0,
        foto_url: ''
    };
    
    let res;
    if (id) {
        res = await fetch(`/clientes/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
    } else {
        res = await fetch('/clientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
    }
    
    if (res.ok) {
        cerrarModal();
        cargarClientes();
    } else {
        alert('Error al guardar cliente');
    }
}

async function eliminarCliente(id) {
    if (confirm('¿Eliminar este cliente?')) {
        await fetch(`/clientes/${id}`, { method: 'DELETE' });
        cargarClientes();
    } 
}

async function cerrarSesion() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/';
}

verificarSesion();
cargarMembresias();
cargarClientes();
</script>
</body>
</html>
