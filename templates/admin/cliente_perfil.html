<!DOCTYPE html>
<html>
<head>
    <title>Perfil Cliente - Admin Box</title>
    <link rel="manifest" href="/ADMIN/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="header">
    <h2>👤 Perfil del Cliente</h2>
    <button onclick="window.location.href='/admin/dashboard'">Volver al Dashboard</button>
</div>

<div class="card">
    <div id="info" class="info">Cargando...</div>
</div>

<div class="card">
    <h3>🏋️ Registros Personales (RM)</h3>
    <div style="overflow-x:auto;">
        <table style="width:100%">
            <thead>
                <tr><th>Habilidad</th><th>Peso (kg)</th><th>Fecha</th>
            </thead>
            <tbody id="rmBody"></tbody>
        </table>
    </div>
</div>

<script>
// Obtener email de la URL
const urlParams = new URLSearchParams(window.location.search);
const clienteEmail = urlParams.get('email');

if (!clienteEmail) {
    window.location.href = '/admin/dashboard';
}

async function cargarPerfil() {
    try {
        const response = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('info').innerHTML = `
                <div class="campo">
                    <div class="campo-label">🏷️ Nombre</div>
                    <div class="campo-valor">${data.nombre || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📧 Email</div>
                    <div class="campo-valor">${data.email || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📱 Celular</div>
                    <div class="campo-valor">${data.celular || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">🏥 EPS</div>
                    <div class="campo-valor">${data.eps || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">💳 Membresía</div>
                    <div class="campo-valor">${data.membresia_id || 'No asignada'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📅 Clases restantes</div>
                    <div class="campo-valor">${data.clases_restantes || 0}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📆 Vencimiento</div>
                    <div class="campo-valor">${data.fecha_vencimiento || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">🔓 Estado</div>
                    <div class="campo-valor">${data.activo == 'TRUE' ? '✅ Activo' : '❌ Inactivo'}</div>
                </div>
            `;
        } else {
            document.getElementById('info').innerHTML = `<p style="color:#ff6666;">❌ ${data.error}</p>`;
        }
    } catch (error) {
        document.getElementById('info').innerHTML = '<p style="color:#ff6666;">❌ Error de conexión</p>';
    }
}

async function cargarRM() {
    try {
        const response = await fetch(`/admin/rm/${clienteEmail}?email=${encodeURIComponent(clienteEmail)}`);
        const rmRecords = await response.json();
        
        const tbody = document.getElementById('rmBody');
        tbody.innerHTML = '';
        
        if (!rmRecords || rmRecords.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">No hay registros RM</td></tr>';
            return;
        }
        
        // Cargar habilidades para obtener nombres
        const habRes = await fetch('/api/habilidades');
        const habilidades = await habRes.json();
        const habilidadMap = {};
        habilidades.forEach(h => { habilidadMap[h.id] = h.nombre_habilidad; });
        
        rmRecords.forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${habilidadMap[r.habilidad_id] || 'Desconocido'}</td>
                    <td>${r.peso_kg} kg</td>
                    <td>${r.fecha_registro || ''}</td>
                </tr>
            `;
        });
    } catch (error) {
        document.getElementById('rmBody').innerHTML = '<tr><td colspan="3">Error al cargar RM</td></tr>';
    }
}

cargarPerfil();
cargarRM();
</script>
</body>
</html>
