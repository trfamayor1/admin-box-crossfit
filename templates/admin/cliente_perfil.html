<!DOCTYPE html>
<html>
<head>
    <title>Perfil Cliente - Machine Box Admin</title>
    <link rel="manifest" href="/ADMIN/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .perfil-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .perfil-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .perfil-foto {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-surface);
            border: 3px solid var(--primary);
        }
        
        .perfil-titulo {
            flex: 1;
        }
        
        .perfil-titulo h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        
        .seccion-perfil {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .seccion-header {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
        }
        
        .seccion-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .seccion-body {
            padding: 20px;
        }
        
        .detalle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }
        
        .detalle-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
        }
        
        .detalle-label {
            font-weight: 600;
            color: var(--primary);
        }
        
        .detalle-valor {
            color: var(--text-primary);
        }
        
        .rm-container {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .rm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
        }
        
        .rm-nombre {
            font-weight: 500;
        }
        
        .rm-peso {
            font-weight: 700;
            color: #10b981;
        }
        
        .rm-fecha {
            font-size: 11px;
            color: var(--text-disabled);
        }
        
        .btn-volver {
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: 20px;
        }
        
        .btn-volver:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-glow);
        }
        
        .cliente-estado {
            display: inline-block;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            margin-top: 5px;
        }
        
        .cliente-estado.inactivo {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            .perfil-header {
                flex-direction: column;
                text-align: center;
            }
            .detalle-item {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
            .rm-item {
                flex-direction: column;
                text-align: center;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="perfil-container">
        <button class="btn-volver" onclick="window.location.href='/admin/dashboard'">
            <i class="fas fa-arrow-left"></i> Volver al Dashboard
        </button>
        
        <div id="perfilContent">
            <div class="empty-state">
                <i class="fas fa-spinner fa-pulse"></i>
                <p>Cargando perfil del cliente...</p>
            </div>
        </div>
    </div>
</div>

<script>
// Obtener email de la URL
const urlParams = new URLSearchParams(window.location.search);
const clienteEmail = urlParams.get('email');

if (!clienteEmail) {
    window.location.href = '/admin/dashboard';
}

let habilidadesMap = {};

async function cargarHabilidades() {
    const res = await fetch('/api/habilidades');
    const habilidades = await res.json();
    habilidadesMap = {};
    habilidades.forEach(h => {
        habilidadesMap[h.id] = h.nombre_habilidad;
    });
}

async function cargarPerfil() {
    const container = document.getElementById('perfilContent');
    
    try {
        // Cargar habilidades primero
        await cargarHabilidades();
        
        // Cargar perfil del cliente
        const perfilRes = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        const perfilData = await perfilRes.json();
        
        if (!perfilRes.ok) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${perfilData.error || 'Error al cargar el perfil'}</p>
                </div>
            `;
            return;
        }
        
        // Cargar RM del cliente
        const rmRes = await fetch(`/admin/rm/${encodeURIComponent(clienteEmail)}`);
        const rmRecords = await rmRes.json();
        
        // Obtener iniciales para el avatar (solo si no hay foto)
        const nombreCompleto = perfilData.nombre || 'Cliente';
        const iniciales = nombreCompleto.split(' ').map(p => p[0]).join('').toUpperCase().substring(0, 2);
        const estadoClass = perfilData.activo == 'TRUE' ? 'activo' : 'inactivo';
        const estadoText = perfilData.activo == 'TRUE' ? 'Activo' : 'Inactivo';
        
        // Generar color para avatar
        let hash = 0;
        for (let i = 0; i < clienteEmail.length; i++) {
            hash = ((hash << 5) - hash) + clienteEmail.charCodeAt(i);
            hash = hash & hash;
        }
        const hue = Math.abs(hash % 360);
        
        // Foto de perfil
        let fotoHtml = '';
        if (perfilData.foto_url) {
            fotoHtml = `<img src="${perfilData.foto_url}" class="perfil-foto" alt="Foto de perfil">`;
        } else {
            fotoHtml = `<div class="perfil-foto" style="background: hsl(${hue}, 70%, 55%); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: white;">${iniciales}</div>`;
        }
        
        let rmHtml = '';
        if (rmRecords && rmRecords.length > 0) {
            rmHtml = `
                <div class="seccion-perfil">
                    <div class="seccion-header">
                        <h3><i class="fas fa-chart-simple" style="color: var(--primary);"></i> Registros Personales (RM)</h3>
                    </div>
                    <div class="seccion-body">
                        <div class="rm-container">
                            ${rmRecords.map(r => `
                                <div class="rm-item">
                                    <div>
                                        <div class="rm-nombre">🏋️ ${habilidadesMap[r.habilidad_id] || 'Desconocido'}</div>
                                        <div class="rm-fecha"><i class="fas fa-calendar-alt"></i> ${r.fecha_registro || ''}</div>
                                    </div>
                                    <div class="rm-peso">${r.peso_kg} kg</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        } else {
            rmHtml = `
                <div class="seccion-perfil">
                    <div class="seccion-header">
                        <h3><i class="fas fa-chart-simple" style="color: var(--primary);"></i> Registros Personales (RM)</h3>
                    </div>
                    <div class="seccion-body">
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list"></i>
                            <p>Este cliente no tiene registros RM aún</p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = `
            <div class="perfil-header">
                ${fotoHtml}
                <div class="perfil-titulo">
                    <h1><i class="fas fa-user"></i> ${perfilData.nombre || 'Sin nombre'}</h1>
                    <p style="color: var(--text-secondary);">${perfilData.email || 'Sin email'}</p>
                    <span class="cliente-estado ${estadoClass}">${estadoText}</span>
                </div>
            </div>
            
            <div class="seccion-perfil">
                <div class="seccion-header">
                    <h3><i class="fas fa-id-card" style="color: var(--primary);"></i> Información Personal</h3>
                </div>
                <div class="seccion-body">
                    <div class="detalle-grid">
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-id-card"></i> ID</span>
                            <span class="detalle-valor">${perfilData.id || 'N/A'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-phone"></i> Celular</span>
                            <span class="detalle-valor">${perfilData.celular || 'No registrado'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-hospital-user"></i> EPS</span>
                            <span class="detalle-valor">${perfilData.eps || 'No registrado'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-tag"></i> Membresía</span>
                            <span class="detalle-valor">${perfilData.membresia_id || 'No asignada'}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-calendar-check"></i> Clases Restantes</span>
                            <span class="detalle-valor" style="color: ${(perfilData.clases_restantes || 0) > 0 ? '#10b981' : '#dc2626'}">${perfilData.clases_restantes || 0}</span>
                        </div>
                        <div class="detalle-item">
                            <span class="detalle-label"><i class="fas fa-calendar-alt"></i> Fecha Vencimiento</span>
                            <span class="detalle-valor">${perfilData.fecha_vencimiento || 'No registrado'}</span>
                        </div>
                    </div>
                </div>
            </div>
            
            ${rmHtml}
        `;
        
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error de conexión al cargar el perfil</p>
            </div>
        `;
    }
}

cargarPerfil();
</script>
</body>
</html>
