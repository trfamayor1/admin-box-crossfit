<!DOCTYPE html>
<html>
<head>
    <title>Mis Reservas - Machine Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        /* Estilos específicos para reservas */
        .reserva-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-normal);
        }
        
        .reserva-card:hover {
            border-color: var(--border-glow);
        }
        
        .reserva-fecha {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .reserva-hora {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0;
            color: var(--text-primary);
        }
        
        .btn-cancelar {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            width: 100%;
            margin-top: 12px;
        }
        
        .btn-cancelar:hover {
            background: #b91c1c;
            transform: scale(1.02);
        }
        
        .otros-clientes {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .otros-clientes summary {
            cursor: pointer;
            color: var(--primary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .cliente-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
        }
        
        .btn-ver-rm {
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-ver-rm:hover {
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }
        
        /* Modal RM */
        .modal-content {
            background: var(--bg-surface);
        }
        
        .rm-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-bookmark" style="color: var(--primary);"></i> Mis Reservas</h2>
        <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <nav>
        <a href="/cliente/perfil"><i class="fas fa-user"></i> Mi Perfil</a>
        <a href="/cliente/clases"><i class="fas fa-calendar-alt"></i> Clases</a>
        <a href="/cliente/mis-reservas"><i class="fas fa-bookmark"></i> Mis Reservas</a>
        <a href="/cliente/rm"><i class="fas fa-chart-simple"></i> Mis RM</a>
    </nav>

    <div id="reservasContainer"></div>
    <div id="msg" class="error"></div>
</div>

<!-- Modal para ver RM de otro cliente -->
<div id="modalRM" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModalRM()">&times;</span>
        <h3 id="modalTitulo"><i class="fas fa-dumbbell" style="color: var(--primary);"></i> Registros (RM)</h3>
        <div id="modalRMLista" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

async function cargarReservas() {
    const container = document.getElementById('reservasContainer');
    
    try {
        const response = await fetch('/cliente/mis-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const reservas = await response.json();
        
        container.innerHTML = '';
        
        if (reservas.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p>No tienes reservas activas</p>
                    <p style="font-size: 12px; margin-top: 8px;">Las reservas de clases pasadas ya no aparecen aquí.</p>
                </div>
            `;
            return;
        }
        
        for (const r of reservas) {
            const otrosClientes = await cargarOtrosClientes(r.clase_id);
            
            container.innerHTML += `
                <div class="reserva-card">
                    <div class="reserva-fecha">
                        <i class="fas fa-calendar-day"></i> ${r.fecha}
                    </div>
                    <div class="reserva-hora">
                        <i class="fas fa-clock"></i> ${r.hora}
                    </div>
                    <button class="btn-cancelar" onclick="cancelarReserva(${r.reserva_id}, ${r.clase_id})">
                        <i class="fas fa-trash-alt"></i> Cancelar reserva
                    </button>
                    
                    <div class="otros-clientes">
                        <details>
                            <summary><i class="fas fa-users"></i> Ver otros clientes (${otrosClientes.length})</summary>
                            <div id="otrosClientes-${r.clase_id}" style="margin-top: 10px;">
                                ${otrosClientes.map(c => `
                                    <div class="cliente-item">
                                        <span><i class="fas fa-user"></i> ${c.nombre}</span>
                                        <button class="btn-ver-rm" onclick="verRMCliente('${c.email}', '${c.nombre}')">
                                            <i class="fas fa-chart-simple"></i> Ver RM
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </details>
                    </div>
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error al cargar reservas</p>
            </div>
        `;
    }
}

async function cargarOtrosClientes(claseId) {
    try {
        const response = await fetch('/cliente/otros-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        return await response.json();
    } catch (error) {
        console.error('Error cargar otros clientes:', error);
        return [];
    }
}

async function verRMCliente(email, nombre) {
    const modal = document.getElementById('modalRM');
    const titulo = document.getElementById('modalTitulo');
    const lista = document.getElementById('modalRMLista');
    
    titulo.innerHTML = `<i class="fas fa-dumbbell" style="color: var(--primary);"></i> RM de ${nombre}`;
    lista.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Cargando...</div>';
    modal.style.display = 'flex';
    
    try {
        const response = await fetch(`/cliente/datos-publicos?email=${encodeURIComponent(email)}`);
        const data = await response.json();
        
        if (response.ok && data.rm && data.rm.length > 0) {
            lista.innerHTML = data.rm.map(r => `
                <div class="rm-item">
                    <i class="fas fa-dumbbell" style="color: var(--primary);"></i>
                    <strong>${r.habilidad_nombre || 'Desconocido'}</strong>: ${r.peso_kg} kg
                    <span style="font-size: 11px; color: var(--text-disabled);"> (${r.fecha_registro || ''})</span>
                </div>
            `).join('');
        } else {
            lista.innerHTML = '<p><i class="fas fa-info-circle"></i> Este cliente no tiene registros RM aún.</p>';
        }
    } catch (error) {
        lista.innerHTML = '<p style="color: #dc2626;"><i class="fas fa-exclamation-circle"></i> Error al cargar RM</p>';
    }
}

function cerrarModalRM() {
    document.getElementById('modalRM').style.display = 'none';
}

async function cancelarReserva(reservaId, claseId) {
    if (!confirm('¿Cancelar esta reserva?')) return;
    
    const msg = document.getElementById('msg');
    msg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Cancelando...';
    msg.className = '';
    
    try {
        const response = await fetch('/cliente/cancelar-reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                reserva_id: reservaId,
                clase_id: claseId
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = `<i class="fas fa-check-circle"></i> ${data.mensaje}`;
            msg.className = 'exito';
            cargarReservas();
            setTimeout(() => { msg.innerHTML = ''; }, 3000);
        } else {
            msg.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error || 'Error al cancelar'}`;
            msg.className = 'error';
        }
    } catch (error) {
        console.error('Error cancelar:', error);
        msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error de conexión';
        msg.className = 'error';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

cargarReservas();
</script>
</body>
</html>
