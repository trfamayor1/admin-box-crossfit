<!DOCTYPE html>
<html>
<head>
    <title>Mis Reservas - Mi Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="header">
    <h2>📋 Mis Reservas</h2>
    <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
</div>

<nav>
    <a href="/cliente/perfil">Mi Perfil</a>
    <a href="/cliente/clases">Clases</a>
    <a href="/cliente/mis-reservas">Mis Reservas</a>
    <a href="/cliente/rm">Mis RM</a>
</nav>

<div id="reservasContainer"></div>
<p id="msg" class="error"></p>

<!-- Modal para ver RM de otro cliente -->
<div id="modalRM" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModalRM()">&times;</span>
        <h3 id="modalTitulo">Registros (RM)</h3>
        <div id="modalRMLista"></div>
    </div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

async function cargarReservas() {
    const container = document.getElementById('reservasContainer');
    const msg = document.getElementById('msg');
    
    try {
        const response = await fetch('/cliente/mis-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const reservas = await response.json();
        
        container.innerHTML = '';
        
        if (reservas.length === 0) {
            container.innerHTML = '<div class="card"><p>📭 No tienes reservas activas. Las reservas de clases pasadas ya no aparecen aquí.</p></div>';
            return;
        }
        
        for (const r of reservas) {
            // Cargar los otros clientes que reservaron esta misma clase
            const otrosClientes = await cargarOtrosClientes(r.clase_id);
            
            container.innerHTML += `
                <div class="card">
                    <div class="clase-fecha">📅 ${r.fecha}</div>
                    <div class="clase-hora">⏰ ${r.hora}</div>
                    <button class="btn-cancelar" onclick="cancelarReserva(${r.reserva_id}, ${r.clase_id})">❌ Cancelar reserva</button>
                    
                    <div class="otros-clientes">
                        <details>
                            <summary>👥 Ver otros clientes (${otrosClientes.length})</summary>
                            <div id="otrosClientes-${r.clase_id}" style="margin-top:10px;">
                                ${otrosClientes.map(c => `
                                    <div class="cliente-item">
                                        🏋️ ${c.nombre}
                                        <button class="ver-rm" onclick="verRMCliente('${c.email}', '${c.nombre}')">Ver RM</button>
                                    </div>
                                `).join('')}
                            </div>
                        </details>
                    </div>
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="card"><p>❌ Error al cargar reservas</p></div>';
    }
}

async function cargarOtrosClientes(claseId) {
    try {
        const response = await fetch('/cliente/otros-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        const data = await response.json();
        console.log('Otros clientes:', data); // Para depurar
        return data;
    } catch (error) {
        console.error('Error cargar otros clientes:', error);
        return [];
    }
}


async function verRMCliente(email, nombre) {
    const modal = document.getElementById('modalRM');
    const titulo = document.getElementById('modalTitulo');
    const lista = document.getElementById('modalRMLista');
    
    if (!email || email === 'undefined') {
        lista.innerHTML = '<p style="color:#ff6666;">❌ No se pudo obtener el email del cliente</p>';
        modal.style.display = 'flex';
        titulo.innerHTML = `🏋️ Error`;
        return;
    }
    
    titulo.innerHTML = `🏋️ RM de ${nombre}`;
    lista.innerHTML = '<p>Cargando...</p>';
    modal.style.display = 'flex';
    
    try {
        const response = await fetch(`/cliente/datos-publicos?email=${encodeURIComponent(email)}`);
        const data = await response.json();
        
        if (response.ok && data.rm && data.rm.length > 0) {
            lista.innerHTML = data.rm.map(r => `
                <div class="rm-item">
                    <strong>${r.habilidad_nombre || 'Desconocido'}</strong>: ${r.peso_kg} kg
                    <span style="font-size:11px; color:#888;"> (${r.fecha_registro || ''})</span>
                </div>
            `).join('');
        } else {
            lista.innerHTML = '<p>📭 Este cliente no tiene registros RM aún.</p>';
        }
    } catch (error) {
        lista.innerHTML = '<p style="color:#ff6666;">❌ Error al cargar RM</p>';
    }
}

function cerrarModalRM() {
    document.getElementById('modalRM').style.display = 'none';
}

async function cancelarReserva(reservaId, claseId) {
    if (!confirm('¿Cancelar esta reserva?')) return;
    
    const msg = document.getElementById('msg');
    msg.innerHTML = '⏳ Cancelando...';
    msg.className = '';
    
    try {
        const response = await fetch('/cliente/cancelar-reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                reserva_id: reservaId,
                clase_id: claseId
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = `✅ ${data.mensaje}`;
            msg.className = 'exito';
            cargarReservas();
            setTimeout(() => { msg.innerHTML = ''; }, 3000);
        } else {
            msg.innerHTML = `❌ ${data.error || 'Error al cancelar'}`;
            msg.className = 'error';
        }
    } catch (error) {
        console.error('Error cancelar:', error);
        msg.innerHTML = '❌ Error de conexión';
        msg.className = 'error';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

cargarReservas();
</script>
</body>
</html>
