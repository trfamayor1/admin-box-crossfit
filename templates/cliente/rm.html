<!DOCTYPE html>
<html>
<head>
    <title>Mis RM - Mi Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="header">
    <h2>🏋️ Mis Registros (RM)</h2>
    <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
</div>

<nav>
    <a href="/cliente/perfil">Mi Perfil</a>
    <a href="/cliente/clases">Clases</a>
    <a href="/cliente/mis-reservas">Mis Reservas</a>
    <a href="/cliente/rm">Mis RM</a>
</nav>

<div style="margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
    <button onclick="abrirModalRM()" style="background:#00aa55;">+ Nuevo RM</button>
</div>

<input type="text" id="buscador" class="buscar" placeholder="🔍 Buscar habilidad...">

<div id="rmContainer"></div>
<p id="msg" class="error"></p>

<!-- Modal Nuevo/Editar RM -->
<div id="modalRM" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModalRM()">&times;</span>
        <h3 id="modalTituloRM">Nuevo RM</h3>
        <input type="hidden" id="rmId">
        <select id="habilidadId"></select>
        <input type="number" id="pesoKg" placeholder="Peso (kg)" step="0.5">
        <button onclick="guardarRM()">Guardar</button>
    </div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

let habilidades = [];
let rmRecords = [];

async function cargarHabilidades() {
    const res = await fetch('/api/habilidades');
    habilidades = await res.json();
    console.log("📢 Habilidades cargadas:", habilidades);  // 👈 Agrega esto
    const select = document.getElementById('habilidadId');
    select.innerHTML = '';
    habilidades.forEach(h => {
        select.innerHTML += `<option value="${h.id}">${h.nombre_habilidad}</option>`;
    });
}

async function cargarRM() {
    const res = await fetch(`/api/rm?email=${encodeURIComponent(clienteEmail)}`);
    rmRecords = await res.json();
    mostrarRM();
}

function mostrarRM() {
    const container = document.getElementById('rmContainer');
    const busqueda = document.getElementById('buscador').value.toLowerCase();
    
    let filtrados = rmRecords;
    if (busqueda) {
        filtrados = rmRecords.filter(r => {
            const habilidad = habilidades.find(h => String(h.id) === String(r.habilidad_id));
            return habilidad && habilidad.nombre_habilidad.toLowerCase().includes(busqueda);
        });
    }
    
    container.innerHTML = '';
    
    if (filtrados.length === 0) {
        container.innerHTML = '<div class="card"><p>No tienes registros RM aún. Agrega tu primer registro.</p></div>';
        return;
    }
    
    filtrados.forEach(r => {
        // 👇 LÍNEA CORREGIDA: convertir ambos a string para comparar
        const habilidad = habilidades.find(h => String(h.id) === String(r.habilidad_id));
        
        container.innerHTML += `
            <div class="card">
                <div class="rm-info">
                    <strong style="font-size:18px;">🏋️ ${habilidad ? habilidad.nombre_habilidad : `Habilidad ID: ${r.habilidad_id}`}</strong>
                    <div class="rm-valor">${r.peso_kg} kg</div>
                    <div style="font-size:12px; color:#888;">${r.fecha_registro || ''}</div>
                </div>
                <div class="rm-actions">
                    <button class="btn-editar" onclick="editarRM(${r.id})">✏️ Editar</button>
                    <button class="btn-eliminar" onclick="eliminarRM(${r.id})">🗑️ Eliminar</button>
                </div>
            </div>
        `;
    });
}

function abrirModalRM() {
    document.getElementById('modalTituloRM').innerText = 'Nuevo RM';
    document.getElementById('rmId').value = '';
    document.getElementById('pesoKg').value = '';
    document.getElementById('modalRM').style.display = 'flex';
}

function editarRM(id) {
    const rm = rmRecords.find(r => r.id == id);
    if (!rm) return;
    document.getElementById('modalTituloRM').innerText = 'Editar RM';
    document.getElementById('rmId').value = rm.id;
    document.getElementById('habilidadId').value = rm.habilidad_id;
    document.getElementById('pesoKg').value = rm.peso_kg;
    document.getElementById('modalRM').style.display = 'flex';
}

function cerrarModalRM() {
    document.getElementById('modalRM').style.display = 'none';
}

async function guardarRM() {
    const id = document.getElementById('rmId').value;
    const datos = {
        email: clienteEmail,
        habilidad_id: document.getElementById('habilidadId').value,
        peso_kg: parseFloat(document.getElementById('pesoKg').value)
    };
    
    if (!datos.habilidad_id || !datos.peso_kg) {
        mostrarMensaje('Completa todos los campos', 'error');
        return;
    }
    
    const msg = document.getElementById('msg');
    msg.innerHTML = '⏳ Guardando...';
    
    try {
        let res;
        if (id) {
            datos.id = id;
            res = await fetch('/cliente/rm', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        } else {
            res = await fetch('/cliente/rm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        }
        
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'exito');
            cerrarModalRM();
            cargarRM();
        } else {
            mostrarMensaje(data.error, 'error');
        }
    } catch (error) {
        mostrarMensaje('Error de conexión', 'error');
    }
}

async function eliminarRM(id) {
    if (!confirm('¿Eliminar este registro?')) return;
    
    try {
        const res = await fetch('/cliente/rm', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail, id: id })
        });
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(data.mensaje, 'exito');
            cargarRM();
        } else {
            mostrarMensaje(data.error, 'error');
        }
    } catch (error) {
        mostrarMensaje('Error de conexión', 'error');
    }
}

function mostrarMensaje(mensaje, tipo) {
    const msg = document.getElementById('msg');
    msg.innerHTML = tipo === 'exito' ? `✅ ${mensaje}` : `❌ ${mensaje}`;
    msg.className = tipo === 'exito' ? 'exito' : 'error';
    setTimeout(() => { msg.innerHTML = ''; }, 3000);
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

// Event listener para búsqueda
document.getElementById('buscador').addEventListener('input', () => {
    mostrarRM();
});

cargarHabilidades();
cargarRM();
</script>
</body>
</html>
