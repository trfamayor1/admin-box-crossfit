<!DOCTYPE html>
<html>
<head>
    <title>Clases - Mi Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="header">
    <h2>🏋️ Clases Disponibles</h2>
    <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
</div>

<nav>
    <a href="/cliente/perfil">Mi Perfil</a>
    <a href="/cliente/clases">Clases</a>
    <a href="/cliente/mis-reservas">Mis Reservas</a>
</nav>

<div id="clasesContainer" class="loading">Cargando clases...</div>
<p id="msg" class="error"></p>

<script>
// Verificar que el cliente está logueado
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

async function cargarClases() {
    const container = document.getElementById('clasesContainer');
    const msg = document.getElementById('msg');
    
    container.innerHTML = '<div class="loading">Cargando clases...</div>';
    msg.innerHTML = '';
    
    try {
        // Usar la API pública /api/clases
        const response = await fetch('/api/clases');
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('Error response:', errorText);
            container.innerHTML = '';
            msg.innerHTML = '❌ Error del servidor: ' + response.status;
            msg.className = 'error';
            return;
        }
        
        const data = await response.json();
        console.log('Clases recibidas:', data);
        
        container.innerHTML = '';
        
        if (!data || !Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<div class="card"><p>📭 No hay clases disponibles por ahora. El administrador creará clases pronto.</p></div>';
            return;
        }
        
        // Obtener reservas del cliente para saber qué clases ya reservó
        const reservasResponse = await fetch('/cliente/mis-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        const reservas = await reservasResponse.json();
        const clasesReservadas = new Set(reservas.map(r => r.clase_id));
        
        for (const clase of data) {
            const disponibles = (clase.cupos_maximos || 0) - (clase.cupos_ocupados || 0);
            const yaReservada = clasesReservadas.has(clase.id);
            const estaLlena = disponibles <= 0;
            
            container.innerHTML += `
                <div class="card">
                    <div class="clase-fecha">📅 ${clase.fecha || 'Sin fecha'}</div>
                    <div class="clase-hora">⏰ ${clase.hora || 'Sin hora'}</div>
                    <div class="cupos">📊 Cupos disponibles: ${disponibles}</div>
                    ${yaReservada ? 
                        '<button class="reservado" disabled>✅ Ya reservaste</button>' : 
                        (estaLlena ? 
                            '<button class="btn-reservar" disabled>❌ Sin cupos</button>' : 
                            `<button class="btn-reservar" onclick="reservarClase(${clase.id})">📝 Reservar</button>`
                        )
                    }
                </div>
            `;
        }
    } catch (error) {
        console.error('Error detallado:', error);
        container.innerHTML = '';
        msg.innerHTML = '❌ Error de conexión: ' + error.message;
        msg.className = 'error';
    }
}

async function reservarClase(claseId) {
    if (!confirm('¿Reservar esta clase?')) return;
    
    const msg = document.getElementById('msg');
    msg.innerHTML = '⏳ Procesando reserva...';
    msg.className = '';
    
    try {
        const response = await fetch('/cliente/reservar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = `✅ ${data.mensaje}`;
            msg.className = 'exito';
            cargarClases(); // Recargar lista de clases
            setTimeout(() => {
                msg.innerHTML = '';
            }, 3000);
        } else {
            msg.innerHTML = `❌ ${data.error || 'Error al reservar'}`;
            msg.className = 'error';
        }
    } catch (error) {
        console.error('Error reservar:', error);
        msg.innerHTML = '❌ Error de conexión al reservar';
        msg.className = 'error';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

// Cargar clases al iniciar
cargarClases();
</script>
</body>
</html>
