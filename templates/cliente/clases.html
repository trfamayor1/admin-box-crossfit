<!DOCTYPE html>
<html>
<head>
    <title>Clases - Mi Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#111; color:white; font-family:Arial; padding:20px; }
        .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:10px; }
        button{ background:#00aa55; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; }
        .btn-salir{ background:#ff4d00; }
        .card{ background:#1e1e1e; padding:20px; border-radius:15px; margin-bottom:15px; }
        .clase-fecha{ color:#ff4d00; font-size:18px; font-weight:bold; }
        .clase-hora{ font-size:24px; margin:10px 0; }
        .cupos{ color:#66ff66; margin:10px 0; }
        .btn-reservar{ background:#00aa55; padding:10px 20px; }
        .btn-reservar:disabled{ background:#555; cursor:not-allowed; }
        .error{ color:#ff6666; margin-top:15px; text-align:center; }
        .exito{ color:#66ff66; margin-top:15px; text-align:center; }
        nav{ display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap; }
        nav a{ color:white; text-decoration:none; padding:10px; border-radius:10px; background:#333; }
        nav a:hover{ background:#ff4d00; }
    </style>
</head>
<body>
<div class="header">
    <h2>🏋️ Clases Disponibles</h2>
    <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
</div>

<nav>
    <a href="/cliente/perfil">Mi Perfil</a>
    <a href="/cliente/clases">Clases</a>
    <a href="/cliente/mis-reservas">Mis Reservas</a>
</nav>

<div id="clasesContainer"></div>
<p id="msg" class="error"></p>

<script>
// Verificar que el cliente está logueado
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

async function cargarClases() {
    try {
        const response = await fetch('/cliente/clases');
        const clases = await response.json();
        
        const container = document.getElementById('clasesContainer');
        container.innerHTML = '';
        
        if (clases.length === 0) {
            container.innerHTML = '<div class="card"><p>No hay clases disponibles por ahora.</p></div>';
            return;
        }
        
        for (const clase of clases) {
            const disponibles = clase.cupos_maximos - (clase.cupos_ocupados || 0);
            const yaReservada = await verificarReserva(clase.id);
            
            container.innerHTML += `
                <div class="card">
                    <div class="clase-fecha">📅 ${clase.fecha}</div>
                    <div class="clase-hora">⏰ ${clase.hora}</div>
                    <div class="cupos">📊 Cupos disponibles: ${disponibles}</div>
                    <button class="btn-reservar" 
                        onclick="reservarClase(${clase.id})"
                        ${yaReservada || disponibles <= 0 ? 'disabled' : ''}>
                        ${yaReservada ? '✅ Ya reservaste' : (disponibles <= 0 ? '❌ Sin cupos' : '📝 Reservar')}
                    </button>
                </div>
            `;
        }
    } catch (error) {
        document.getElementById('msg').innerHTML = '❌ Error al cargar clases';
    }
}

async function verificarReserva(claseId) {
    try {
        const response = await fetch('/cliente/verificar-reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        const data = await response.json();
        return data.reservado === true;
    } catch (error) {
        return false;
    }
}

async function reservarClase(claseId) {
    if (!confirm('¿Reservar esta clase?')) return;
    
    try {
        const response = await fetch('/cliente/reservar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('msg').innerHTML = `✅ ${data.mensaje}`;
            document.getElementById('msg').className = 'exito';
            cargarClases();
        } else {
            document.getElementById('msg').innerHTML = `❌ ${data.error}`;
            document.getElementById('msg').className = 'error';
        }
    } catch (error) {
        document.getElementById('msg').innerHTML = '❌ Error de conexión';
        document.getElementById('msg').className = 'error';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

cargarClases();
</script>
</body>
</html>
