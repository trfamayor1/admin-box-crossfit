<!DOCTYPE html>
<html>
<head>
    <title>RESERVAR - Machine Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .clase-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(18, 17, 24, 0.98) 100%);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(240, 233, 29, 0.15);
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .clase-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transition: all var(--transition-normal);
        }
        
        .clase-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
        }
        
        .clase-card:hover::before {
            width: 8px;
        }
        
        .clase-fecha {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        
        .clase-hora {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: -1px;
        }
        
        .clase-cupos {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
        
        .clase-cupos.lleno {
            background: rgba(220, 38, 38, 0.15);
            color: #dc2626;
        }
        
        .btn-reservar {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--bg-primary);
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-reservar:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-glow);
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
        }
        
        .btn-reservar:disabled {
            background: var(--text-disabled);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-reservar.reservado {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .skeleton-card {
            background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.05) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
        }
        
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 16px;
        }
        
        nav a i {
            margin-right: 8px;
        }
        
        /* Botón RESERVAR destacado en el menú */
        .btn-resaltado {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--bg-primary) !important;
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 24px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(240, 233, 29, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-resaltado:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(240, 233, 29, 0.5);
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
        }
        
        @media (max-width: 768px) {
            .btn-resaltado {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-calendar-alt" style="color: var(--primary);"></i> RESERVAR</h2>
        <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <nav>
        <a href="/cliente/perfil"><i class="fas fa-user"></i> Mi Perfil</a>
        <a href="/cliente/clases" class="btn-resaltado"><i class="fas fa-calendar-alt"></i> RESERVAR</a>
        <a href="/cliente/mis-reservas"><i class="fas fa-bookmark"></i> Mis Reservas</a>
        <a href="/cliente/rm"><i class="fas fa-chart-simple"></i> Mis RM</a>
    </nav>

    <div id="clasesContainer" class="loading-spinner">
        <i class="fas fa-spinner fa-pulse"></i>
        <p>Cargando clases...</p>
    </div>
    <div id="msg" class="error"></div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

// ============================================
// FUNCIÓN PARA VERIFICAR SI TIENE RESERVA ACTIVA
// ============================================

// ============================================
// FUNCIÓN PARA FORMATEAR FECHA EN ESPAÑOL
// ============================================
function formatearFechaLegible(fechaStr) {
    if (!fechaStr) return 'Sin fecha';
    const [year, month, day] = fechaStr.split('-');
    const fecha = new Date(year, month - 1, day);
    const hoy = new Date();
    const manana = new Date(hoy);
    manana.setDate(hoy.getDate() + 1);
    
    if (fecha.toDateString() === hoy.toDateString()) {
        return 'HOY';
    } else if (fecha.toDateString() === manana.toDateString()) {
        return 'MAÑANA';
    }
    return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
}

// ============================================
// VERIFICAR RESERVA DE UNA CLASE ESPECÍFICA
// ============================================
async function verificarReserva(claseId) {
    try {
        const response = await fetch('/cliente/verificar-reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        const data = await response.json();
        return data.reservado === true;
    } catch (error) {
        return false;
    }
}

// ============================================
// CARGAR CLASES
// ============================================
async function cargarClases() {
    const container = document.getElementById('clasesContainer');
    const msg = document.getElementById('msg');
    
    // Mostrar esqueleto de carga
    container.innerHTML = `<div class="skeleton-card" style="height: 180px;"></div>`;
    
    try {
        // 1. Verificar si tiene reserva activa (una petición)
        const tieneReserva = await tieneReservaActiva();
        
        if (tieneReserva) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-clock"></i>
                    <p style="font-size: 18px; margin-top: 16px;">Ya tienes una reserva activa</p>
                    <p style="font-size: 14px; margin-top: 8px;">Cancela tu reserva actual en "Mis Reservas" para reservar otra clase.</p>
                </div>
            `;
            return;
        }
        
        // 2. Obtener clases disponibles (con timestamp para evitar caché)
        const timestamp = Date.now();
        const clasesResponse = await fetch(`/api/clases?email=${encodeURIComponent(clienteEmail)}&t=${timestamp}`);
        const clases = await clasesResponse.json();
        
        // 3. Obtener TODAS las reservas del cliente de una sola vez
        const reservasResponse = await fetch('/cliente/mis-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        const reservas = await reservasResponse.json();
        const clasesReservadas = new Set(reservas.map(r => r.clase_id));
        
        container.innerHTML = '';
        
        if (!clases || clases.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p style="font-size: 18px; margin-top: 16px;">No hay clases disponibles</p>
                    <p style="font-size: 14px; margin-top: 8px;">No hay clases en las próximas 24 horas</p>
                </div>
            `;
            return;
        }
        
        // 4. Mostrar clases (sin llamar verificarReserva por cada una)
        for (const clase of clases) {
            const disponibles = (clase.cupos_maximos || 0) - (clase.cupos_ocupados || 0);
            const yaReservada = clasesReservadas.has(clase.id);
            const estaLlena = disponibles <= 0;
            
            container.innerHTML += `
                <div class="clase-card">
                    <div class="clase-fecha">
                        <i class="fas fa-calendar-day"></i> ${formatearFechaLegible(clase.fecha)}
                    </div>
                    <div class="clase-hora">
                        <i class="fas fa-clock"></i> ${clase.hora || 'Sin hora'}
                    </div>
                    <div class="clase-cupos ${estaLlena ? 'lleno' : ''}">
                        <i class="fas fa-users"></i> ${disponibles} cupo${disponibles !== 1 ? 's' : ''} disponible${disponibles !== 1 ? 's' : ''}
                    </div>
                    ${yaReservada ? 
                        `<button class="btn-reservar reservado" disabled><i class="fas fa-check-circle"></i> ¡YA RESERVASTE!</button>` : 
                        (estaLlena ? 
                            `<button class="btn-reservar" disabled><i class="fas fa-ban"></i> SIN CUPOS</button>` : 
                            `<button class="btn-reservar" onclick="reservarClase(${clase.id})"><i class="fas fa-calendar-plus"></i> RESERVAR</button>`
                        )
                    }
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error al cargar las clases</p>
                <button onclick="cargarClases()" class="btn-agregar" style="margin-top: 16px;">Reintentar</button>
            </div>
        `;
    }
}
async function cargarClases() {
    const container = document.getElementById('clasesContainer');
    const msg = document.getElementById('msg');
    
    container.innerHTML = `<div class="skeleton-card" style="height: 180px;"></div>`;
    
    try {
        // 1. Obtener reservas UNA SOLA VEZ (para saber si tiene activa y qué clases)
        const reservasResponse = await fetch('/cliente/mis-reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        const reservas = await reservasResponse.json();
        
        // 2. Verificar si tiene reserva activa
        const tieneReservaActiva = reservas.length > 0;
        
        if (tieneReservaActiva) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-clock"></i>
                    <p style="font-size: 18px; margin-top: 16px;">Ya tienes una reserva activa</p>
                    <p style="font-size: 14px; margin-top: 8px;">Cancela tu reserva actual en "Mis Reservas" para reservar otra clase.</p>
                </div>
            `;
            return;
        }
        
        // 3. Obtener clases disponibles
        const timestamp = Date.now();
        const clasesResponse = await fetch(`/api/clases?email=${encodeURIComponent(clienteEmail)}&t=${timestamp}`);
        const clases = await clasesResponse.json();
        
        container.innerHTML = '';
        
        if (!clases || clases.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p>No hay clases disponibles</p>
                </div>
            `;
            return;
        }
        
        // 4. Crear Set de clases reservadas (para saber qué clases ya reservó)
        const clasesReservadas = new Set(reservas.map(r => r.clase_id));
        
        // 5. Mostrar clases
        for (const clase of clases) {
            const disponibles = (clase.cupos_maximos || 0) - (clase.cupos_ocupados || 0);
            const yaReservada = clasesReservadas.has(clase.id);
            const estaLlena = disponibles <= 0;
            
            container.innerHTML += `
                <div class="clase-card">
                    <div class="clase-fecha">
                        <i class="fas fa-calendar-day"></i> ${formatearFechaLegible(clase.fecha)}
                    </div>
                    <div class="clase-hora">
                        <i class="fas fa-clock"></i> ${clase.hora || 'Sin hora'}
                    </div>
                    <div class="clase-cupos ${estaLlena ? 'lleno' : ''}">
                        <i class="fas fa-users"></i> ${disponibles} cupo${disponibles !== 1 ? 's' : ''} disponible${disponibles !== 1 ? 's' : ''}
                    </div>
                    ${yaReservada ? 
                        `<button class="btn-reservar reservado" disabled><i class="fas fa-check-circle"></i> ¡YA RESERVASTE!</button>` : 
                        (estaLlena ? 
                            `<button class="btn-reservar" disabled><i class="fas fa-ban"></i> SIN CUPOS</button>` : 
                            `<button class="btn-reservar" onclick="reservarClase(${clase.id})"><i class="fas fa-calendar-plus"></i> RESERVAR</button>`
                        )
                    }
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error al cargar las clases</p>
                <button onclick="cargarClases()" class="btn-agregar" style="margin-top: 16px;">Reintentar</button>
            </div>
        `;
    }
}

// ============================================
// RESERVAR CLASE
// ============================================
async function reservarClase(claseId) {
    const msg = document.getElementById('msg');
    msg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando reserva...';
    msg.className = '';
    
    try {
        const response = await fetch('/cliente/reservar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = `<i class="fas fa-check-circle"></i> ${data.mensaje}`;
            msg.className = 'exito';
            cargarClases();
            setTimeout(() => { msg.innerHTML = ''; }, 3000);
        } else {
            msg.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error || 'Error al reservar'}`;
            msg.className = 'error';
        }
    } catch (error) {
        console.error('Error reservar:', error);
        msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error de conexión';
        msg.className = 'error';
    }
}

// ============================================
// CERRAR SESIÓN
// ============================================
function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

// ============================================
// INICIALIZAR
// ============================================
cargarClases();
</script>
</body>
</html>
