<!DOCTYPE html>
<html>
<head>
    <title>RESERVAR - Machine Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .clase-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-normal);
        }
        
        .clase-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
        }
        
        .clase-fecha {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .clase-hora {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .clase-cupos {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        
        .clase-cupos.lleno {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
        }
        
        .btn-reservar {
            width: 100%;
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .btn-reservar:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-reservar:disabled {
            background: var(--text-disabled);
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-reservar.reservado {
            background: #10b981;
            color: white;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }
        
        nav a i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-calendar-alt" style="color: var(--primary);"></i> RESERVAR</h2>
        <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <nav>
        <a href="/cliente/perfil"><i class="fas fa-user"></i> Mi Perfil</a>
        <a href="/cliente/clases"><i class="fas fa-calendar-alt"></i> RESERVAR</a>
        <a href="/cliente/mis-reservas"><i class="fas fa-bookmark"></i> Mis Reservas</a>
        <a href="/cliente/rm"><i class="fas fa-chart-simple"></i> Mis RM</a>
    </nav>

    <div id="clasesContainer" class="loading-spinner">
        <i class="fas fa-spinner fa-pulse"></i>
        <p>Cargando clases...</p>
    </div>
    <div id="msg" class="error"></div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

async function cargarClases() {
    const container = document.getElementById('clasesContainer');
    const msg = document.getElementById('msg');
    
    try {
        const response = await fetch('/api/clases');
        
        if (!response.ok) {
            throw new Error('Error al cargar clases');
        }
        
        const data = await response.json();
        
        container.innerHTML = '';
        
        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p>No hay clases disponibles en las próximas 24 horas</p>
                </div>
            `;
            return;
        }
        
        for (const clase of data) {
            const disponibles = (clase.cupos_maximos || 0) - (clase.cupos_ocupados || 0);
            const yaReservada = await verificarReserva(clase.id);
            const estaLlena = disponibles <= 0;
            
            container.innerHTML += `
                <div class="clase-card">
                    <div class="clase-fecha">
                        <i class="fas fa-calendar-day"></i> ${clase.fecha || 'Sin fecha'}
                    </div>
                    <div class="clase-hora">
                        <i class="fas fa-clock"></i> ${clase.hora || 'Sin hora'}
                    </div>
                    <div class="clase-cupos ${estaLlena ? 'lleno' : ''}">
                        <i class="fas fa-users"></i> ${disponibles} cupos disponibles
                    </div>
                    ${yaReservada ? 
                        `<button class="btn-reservar reservado" disabled><i class="fas fa-check-circle"></i> Ya reservaste</button>` : 
                        (estaLlena ? 
                            `<button class="btn-reservar" disabled><i class="fas fa-ban"></i> Sin cupos</button>` : 
                            `<button class="btn-reservar" onclick="reservarClase(${clase.id})"><i class="fas fa-calendar-plus"></i> Reservar</button>`
                        )
                    }
                </div>
            `;
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Error al cargar las clases. Intenta de nuevo.</p>
            </div>
        `;
    }
}

async function verificarReserva(claseId) {
    try {
        const response = await fetch('/cliente/verificar-reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        const data = await response.json();
        return data.reservado === true;
    } catch (error) {
        return false;
    }
}

async function reservarClase(claseId) {
    const msg = document.getElementById('msg');
    msg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando reserva...';
    msg.className = '';
    
    try {
        const response = await fetch('/cliente/reservar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: clienteEmail,
                clase_id: claseId 
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = `<i class="fas fa-check-circle"></i> ${data.mensaje}`;
            msg.className = 'exito';
            cargarClases();
            setTimeout(() => { msg.innerHTML = ''; }, 3000);
        } else {
            msg.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error || 'Error al reservar'}`;
            msg.className = 'error';
        }
    } catch (error) {
        console.error('Error reservar:', error);
        msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error de conexión';
        msg.className = 'error';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

cargarClases();
</script>
</body>
</html>
