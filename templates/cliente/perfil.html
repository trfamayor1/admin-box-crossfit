<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#111; color:white; font-family:Arial; padding:20px; }
        .card{ background:#1e1e1e; padding:30px; border-radius:25px; max-width:400px; margin:0 auto; }
        button{ background:#ff4d00; color:white; padding:14px; border:none; border-radius:12px; margin-top:20px; width:100%; cursor:pointer; }
        .error{ color:#ff6666; margin-top:15px; text-align:center; }
        .info{ margin:20px 0; line-height:1.8; }
        h2{ text-align:center; margin-bottom:20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🏋️ Mi Perfil</h2>
    <div id="info" class="info">Cargando...</div>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
    <p id="errorMsg" class="error"></p>
</div>

<script>
async function cargarPerfil() {
    const infoDiv = document.getElementById('info');
    const errorMsg = document.getElementById('errorMsg');
    
    try {
        const response = await fetch('/cliente/perfil');
        const data = await response.json();
        
        if (response.ok) {
            infoDiv.innerHTML = `
                <strong>Nombre:</strong> ${data.nombre || 'No registrado'}<br>
                <strong>Email:</strong> ${data.email || 'No registrado'}<br>
                <strong>Celular:</strong> ${data.celular || 'No registrado'}<br>
                <strong>EPS:</strong> ${data.eps || 'No registrado'}<br>
                <strong>Membresía:</strong> ${data.membresia_id || 'No asignada'}<br>
                <strong>Vencimiento:</strong> ${data.fecha_vencimiento || 'No registrado'}
            `;
            errorMsg.innerHTML = '';
        } else {
            infoDiv.innerHTML = '';
            errorMsg.innerHTML = '❌ ' + (data.error || 'Error al cargar perfil');
        }
    } catch (error) {
        infoDiv.innerHTML = '';
        errorMsg.innerHTML = '❌ Error de conexión con el servidor';
        console.error('Error:', error);
    }
}

async function cerrarSesion() {
    try {
        await fetch('/cliente/logout', { method: 'POST' });
        window.location.href = '/cliente/login';
    } catch (error) {
        alert('Error al cerrar sesión');
    }
}

cargarPerfil();
</script>
</body>
</html>
