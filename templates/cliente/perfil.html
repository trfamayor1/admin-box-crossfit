<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil - Machine Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .foto-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .foto-perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto;
            background: var(--bg-surface);
            border: 3px solid var(--primary);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .info-label {
            font-weight: 600;
            color: var(--primary);
        }
        .info-value {
            color: var(--text-primary);
        }
        .buscar-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .buscar-input input {
            flex: 1;
        }
        .anuncio {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }
        .anuncio-titulo {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .anuncio-fecha {
            font-size: 11px;
            color: var(--text-disabled);
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-dumbbell" style="color: var(--primary);"></i> Mi Perfil</h2>
        <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <nav>
        <a href="/cliente/perfil"><i class="fas fa-user"></i> Mi Perfil</a>
        <a href="/cliente/clases"><i class="fas fa-calendar-alt"></i> Clases</a>
        <a href="/cliente/mis-reservas"><i class="fas fa-bookmark"></i> Mis Reservas</a>
        <a href="/cliente/rm"><i class="fas fa-chart-simple"></i> Mis RM</a>
    </nav>

    <div class="card">
        <div class="foto-container">
            <div class="campo-label">👤 Identificación</div>
            <img id="fotoPerfil" class="foto-perfil" src="" alt="Avatar">
            <p style="font-size:12px; color:var(--text-disabled); margin-top:5px;">
                Identificación visual con tus iniciales
            </p>
        </div>

        <div id="info" class="info">Cargando...</div>
        <p id="errorMsg" class="error"></p>
    </div>

    <div class="card">
        <div class="campo-label" style="margin-bottom:15px;">📢 Anuncios del Box</div>
        <div id="anunciosContainer">
            <p>Cargando anuncios...</p>
        </div>
    </div>

    <div class="card">
        <div class="campo-label" style="margin-bottom:15px;">🔍 Ver RM de otro cliente</div>
        <div class="buscar-input">
            <input type="email" id="buscarEmail" placeholder="Email del cliente">
            <button onclick="buscarRMCliente()"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div id="rmOtroCliente" style="margin-top:15px;"></div>
    </div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

function generarAvatar(nombre, email) {
    const palabras = nombre.split(' ');
    let iniciales = '';
    if (palabras.length >= 2) {
        iniciales = palabras[0][0] + palabras[1][0];
    } else {
        iniciales = palabras[0].substring(0, 2);
    }
    iniciales = iniciales.toUpperCase();
    
    let hash = 0;
    for (let i = 0; i < email.length; i++) {
        hash = ((hash << 5) - hash) + email.charCodeAt(i);
        hash = hash & hash;
    }
    const hue = Math.abs(hash % 360);
    
    return `https://ui-avatars.com/api/?name=${iniciales}&background=hsl(${hue},70%,55%)&color=fff&size=120&bold=true&length=2&fontsize=0.5`;
}

async function cargarPerfil() {
    const infoDiv = document.getElementById('info');
    const errorMsg = document.getElementById('errorMsg');
    
    try {
        const response = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            infoDiv.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-user"></i> Nombre</span>
                        <span class="info-value">${data.nombre || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="info-value">${data.email || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-phone"></i> Celular</span>
                        <span class="info-value">${data.celular || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-hospital-user"></i> EPS</span>
                        <span class="info-value">${data.eps || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-tag"></i> Membresía</span>
                        <span class="info-value">${data.membresia_id || 'No asignada'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-calendar-check"></i> Clases restantes</span>
                        <span class="info-value" style="color: #10b981; font-weight: 700;">${data.clases_restantes || 0}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-calendar-alt"></i> Vencimiento</span>
                        <span class="info-value">${data.fecha_vencimiento || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-circle"></i> Estado</span>
                        <span class="info-value">${data.activo == 'TRUE' ? '<span style="color:#10b981;">✅ Activo</span>' : '<span style="color:#dc2626;">❌ Inactivo</span>'}</span>
                    </div>
                </div>
            `;
            
            const avatarUrl = generarAvatar(data.nombre, data.email);
            document.getElementById('fotoPerfil').src = avatarUrl;
            
            errorMsg.innerHTML = '';
        } else {
            infoDiv.innerHTML = '';
            errorMsg.innerHTML = '❌ ' + (data.error || 'Error al cargar perfil');
        }
    } catch (error) {
        infoDiv.innerHTML = '';
        errorMsg.innerHTML = '❌ Error de conexión';
        console.error('Error:', error);
    }
}

async function cargarAnuncios() {
    const container = document.getElementById('anunciosContainer');
    try {
        const response = await fetch('/cliente/anuncios');
        const anuncios = await response.json();
        
        if (!anuncios || anuncios.length === 0) {
            container.innerHTML = '<p style="color:var(--text-disabled);">No hay anuncios disponibles</p>';
            return;
        }
        
        let html = '';
        for (const a of anuncios) {
            html += `
                <div class="anuncio">
                    <div class="anuncio-titulo">📢 ${a.titulo || 'Sin título'}</div>
                    <div>${a.texto || ''}</div>
                    <div class="anuncio-fecha">📅 ${a.fecha_publicacion || ''}</div>
                </div>
            `;
        }
        container.innerHTML = html;
    } catch (error) {
        container.innerHTML = '<p style="color:#dc2626;">Error al cargar anuncios</p>';
    }
}

async function buscarRMCliente() {
    const email = document.getElementById('buscarEmail').value;
    const container = document.getElementById('rmOtroCliente');
    
    if (!email) {
        container.innerHTML = '<p style="color:#dc2626;">❌ Ingresa un email</p>';
        return;
    }
    
    container.innerHTML = '<p><i class="fas fa-spinner fa-pulse"></i> Cargando...</p>';
    
    try {
        const perfilRes = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        const perfilData = await perfilRes.json();
        
        if (!perfilRes.ok) {
            container.innerHTML = `<p style="color:#dc2626;">❌ Cliente no encontrado</p>`;
            return;
        }
        
        const rmRes = await fetch(`/cliente/rm/publico?email=${encodeURIComponent(email)}`);
        const rmRecords = await rmRes.json();
        
        if (!rmRecords || rmRecords.length === 0) {
            container.innerHTML = `<p>📭 ${perfilData.nombre || 'El cliente'} no tiene registros RM aún.</p>`;
            return;
        }
        
        let html = `<div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-top: 10px;">
            <div style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">🏋️ RM de ${perfilData.nombre}</div>`;
        
        rmRecords.forEach(r => {
            html += `
                <div style="margin: 8px 0; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                    <strong>${r.habilidad_nombre || 'Desconocido'}</strong>: ${r.peso_kg} kg
                    <span style="font-size: 11px; color: var(--text-disabled);"> (${r.fecha_registro || ''})</span>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<p style="color:#dc2626;">❌ Error de conexión</p>';
    }
}

function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

cargarPerfil();
cargarAnuncios();
</script>
</body>
</html>
