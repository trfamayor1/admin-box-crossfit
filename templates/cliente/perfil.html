<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil - Mi Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="header">
    <h2>🏋️ Mi Perfil</h2>
    <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
</div>

<nav>
    <a href="/cliente/perfil">Mi Perfil</a>
    <a href="/cliente/clases">Clases</a>
    <a href="/cliente/mis-reservas">Mis Reservas</a>
    <a href="/cliente/rm">Mis RM</a>
</nav>

<div class="card">
    <div class="foto-container">
        <div class="campo-label">👤 Identificación</div>
        <img id="fotoPerfil" class="foto-perfil" src="" alt="Avatar">
        <p style="font-size:12px; color:#888; margin-top:5px;">
            Identificación visual con tus iniciales
        </p>
    </div>

    <div id="info" class="info">Cargando...</div>
    <p id="errorMsg" class="error"></p>
</div>

<div class="card">
    <div class="campo-label" style="margin-bottom:15px;">📢 Anuncios del Box</div>
    <div id="anunciosContainer">
        <p>Cargando anuncios...</p>
    </div>
</div>

<div class="card">
    <div class="campo-label" style="margin-bottom:15px;">🔍 Ver RM de otro cliente</div>
    <div class="buscar-input">
        <input type="email" id="buscarEmail" placeholder="Email del cliente">
        <button onclick="buscarRMCliente()">Buscar</button>
    </div>
    <div id="rmOtroCliente" style="margin-top:15px;"></div>
</div>

<script>
// ============================================
// SOLO CLIENTE - NADA DE ADMIN
// ============================================
const clienteEmail = localStorage.getItem('cliente_email');

// Si no hay email de cliente, redirigir a login de cliente
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

// ============================================
// GENERAR AVATAR
// ============================================
function generarAvatar(nombre, email) {
    const palabras = nombre.split(' ');
    let iniciales = '';
    if (palabras.length >= 2) {
        iniciales = palabras[0][0] + palabras[1][0];
    } else {
        iniciales = palabras[0].substring(0, 2);
    }
    iniciales = iniciales.toUpperCase();
    
    let hash = 0;
    for (let i = 0; i < email.length; i++) {
        hash = ((hash << 5) - hash) + email.charCodeAt(i);
        hash = hash & hash;
    }
    const hue = Math.abs(hash % 360);
    
    return `https://ui-avatars.com/api/?name=${iniciales}&background=hsl(${hue},70%,55%)&color=fff&size=120&bold=true&length=2&fontsize=0.5`;
}

// ============================================
// CARGAR PERFIL
// ============================================
async function cargarPerfil() {
    const infoDiv = document.getElementById('info');
    const errorMsg = document.getElementById('errorMsg');
    
    try {
        const response = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            infoDiv.innerHTML = `
                <div class="campo">
                    <div class="campo-label">🏷️ Nombre</div>
                    <div class="campo-valor">${data.nombre || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📧 Email</div>
                    <div class="campo-valor">${data.email || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📱 Celular</div>
                    <div class="campo-valor">${data.celular || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">🏥 EPS</div>
                    <div class="campo-valor">${data.eps || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">💳 Membresía</div>
                    <div class="campo-valor">${data.membresia_id || 'No asignada'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📅 Clases restantes</div>
                    <div class="campo-valor">${data.clases_restantes || 0}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">📆 Vencimiento</div>
                    <div class="campo-valor">${data.fecha_vencimiento || 'No registrado'}</div>
                </div>
                <div class="campo">
                    <div class="campo-label">🔓 Estado</div>
                    <div class="campo-valor">${data.activo == 'TRUE' ? '✅ Activo' : '❌ Inactivo'}</div>
                </div>
            `;
            
            const avatarUrl = generarAvatar(data.nombre, data.email);
            document.getElementById('fotoPerfil').src = avatarUrl;
            
            errorMsg.innerHTML = '';
        } else {
            infoDiv.innerHTML = '';
            errorMsg.innerHTML = '❌ ' + (data.error || 'Error al cargar perfil');
        }
    } catch (error) {
        infoDiv.innerHTML = '';
        errorMsg.innerHTML = '❌ Error de conexión';
        console.error('Error:', error);
    }
}

// ============================================
// CARGAR ANUNCIOS
// ============================================
async function cargarAnuncios() {
    const container = document.getElementById('anunciosContainer');
    try {
        const response = await fetch('/cliente/anuncios');
        const anuncios = await response.json();
        
        if (!anuncios || anuncios.length === 0) {
            container.innerHTML = '<p style="color:#888;">No hay anuncios disponibles</p>';
            return;
        }
        
        let html = '';
        for (const a of anuncios) {
            html += `
                <div class="anuncio">
                    <div class="anuncio-titulo">📢 ${a.titulo || 'Sin título'}</div>
                    <div>${a.texto || ''}</div>
                    <div class="anuncio-fecha">📅 ${a.fecha_publicacion || ''}</div>
                </div>
            `;
        }
        container.innerHTML = html;
    } catch (error) {
        container.innerHTML = '<p style="color:#ff6666;">Error al cargar anuncios</p>';
        console.error('Error anuncios:', error);
    }
}

// ============================================
// VER RM DE OTRO CLIENTE
// ============================================
async function buscarRMCliente() {
    const email = document.getElementById('buscarEmail').value;
    const container = document.getElementById('rmOtroCliente');
    
    if (!email) {
        container.innerHTML = '<p style="color:#ff6666;">❌ Ingresa un email</p>';
        return;
    }
    
    container.innerHTML = '<p>Cargando...</p>';
    
    try {
        const perfilRes = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        const perfilData = await perfilRes.json();
        
        if (!perfilRes.ok) {
            container.innerHTML = `<p style="color:#ff6666;">❌ Cliente no encontrado</p>`;
            return;
        }
        
        const rmRes = await fetch(`/cliente/rm/publico?email=${encodeURIComponent(email)}`);
        const rmRecords = await rmRes.json();
        
        if (!rmRecords || rmRecords.length === 0) {
            container.innerHTML = `<p>📭 ${perfilData.nombre || 'El cliente'} no tiene registros RM aún.</p>`;
            return;
        }
        
        let html = `<div class="rm-otro">
            <div style="font-weight:bold; color:#ff4d00; margin-bottom:10px;">🏋️ RM de ${perfilData.nombre}</div>`;
        
        rmRecords.forEach(r => {
            html += `
                <div class="rm-otro-item">
                    <strong>${r.habilidad_nombre || 'Desconocido'}</strong>: ${r.peso_kg} kg
                    <span style="font-size:11px; color:#888;"> (${r.fecha_registro || ''})</span>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<p style="color:#ff6666;">❌ Error de conexión</p>';
    }
}

// ============================================
// CERRAR SESIÓN
// ============================================
function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

// ============================================
// INICIALIZAR
// ============================================
cargarPerfil();
cargarAnuncios();
</script>
</body>
</html>
