<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil - Machine Box</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .foto-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .foto-perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto;
            background: var(--bg-surface);
            border: 3px solid var(--primary);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .info-label {
            font-weight: 600;
            color: var(--primary);
        }
        .info-value {
            color: var(--text-primary);
        }
        .buscar-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .buscar-input input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-primary);
        }
        .buscar-input button {
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .anuncio {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }
        .anuncio-titulo {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .anuncio-fecha {
            font-size: 11px;
            color: var(--text-disabled);
            margin-top: 8px;
        }
        .rm-item {
            margin: 8px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }
        .btn-subir-foto {
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .rm-otro-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .rm-otro-foto {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }
        .rm-otro-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }
        .anuncio-imagen {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h2><i class="fas fa-dumbbell" style="color: var(--primary);"></i> Mi Perfil</h2>
        <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>

    <nav>
        <a href="/cliente/perfil"><i class="fas fa-user"></i> Mi Perfil</a>
        <a href="/cliente/clases"><i class="fas fa-calendar-alt"></i> Clases</a>
        <a href="/cliente/mis-reservas"><i class="fas fa-bookmark"></i> Mis Reservas</a>
        <a href="/cliente/rm"><i class="fas fa-chart-simple"></i> Mis RM</a>
    </nav>

    <!-- Tarjeta de perfil -->
    <div class="card">
        <!-- Sección para subir foto -->
        <div class="foto-container">
            <img id="fotoPerfil" class="foto-perfil" src="" alt="">
            <div>
                <input type="file" id="fotoInput" accept="image/*" style="margin: 10px 0;">
                <button onclick="subirFoto()" class="btn-subir-foto"><i class="fas fa-upload"></i> Subir foto</button>
            </div>
            <p id="fotoMsg" style="font-size: 12px; margin-top: 5px;"></p>
        </div>

        <div id="info" class="info">Cargando...</div>
        <p id="errorMsg" class="error"></p>
    </div>

    <!-- Tarjeta de anuncios -->
    <div class="card">
        <div class="campo-label" style="margin-bottom:15px;">📢 Anuncios del Box</div>
        <div id="anunciosContainer">
            <p>Cargando anuncios...</p>
        </div>
    </div>

    <!-- Tarjeta para ver RM de otro cliente -->
    <div class="card">
        <div class="campo-label" style="margin-bottom:15px;">🔍 Ver RM de otro cliente</div>
        <div class="buscar-input">
            <input type="email" id="buscarEmail" placeholder="Email del cliente">
            <button onclick="buscarRMCliente()"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div id="rmOtroCliente" style="margin-top:15px;"></div>
    </div>
</div>

<script>
const clienteEmail = localStorage.getItem('cliente_email');
if (!clienteEmail) {
    window.location.href = '/cliente/login';
}

// ============================================
// GENERAR AVATAR CON INICIALES
// ============================================
function generarAvatar(nombre, email) {
    const palabras = nombre.split(' ');
    let iniciales = '';
    if (palabras.length >= 2) {
        iniciales = palabras[0][0] + palabras[1][0];
    } else {
        iniciales = palabras[0].substring(0, 2);
    }
    iniciales = iniciales.toUpperCase();
    
    let hash = 0;
    for (let i = 0; i < email.length; i++) {
        hash = ((hash << 5) - hash) + email.charCodeAt(i);
        hash = hash & hash;
    }
    const hue = Math.abs(hash % 360);
    
    return `https://ui-avatars.com/api/?name=${iniciales}&background=hsl(${hue},70%,55%)&color=fff&size=120&bold=true&length=2&fontsize=0.5`;
}

// ============================================
// SUBIR FOTO DE PERFIL
// ============================================
async function subirFoto() {
    const input = document.getElementById('fotoInput');
    const msg = document.getElementById('fotoMsg');
    const foto = input.files[0];
    
    if (!foto) {
        msg.innerHTML = "❌ Selecciona una foto primero";
        msg.style.color = "#ff6666";
        return;
    }
    
    msg.innerHTML = "⏳ Subiendo...";
    msg.style.color = "#ffaa00";
    
    const formData = new FormData();
    formData.append('email', clienteEmail);
    formData.append('foto', foto);
    
    try {
        const response = await fetch('/cliente/subir-foto', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
            msg.innerHTML = "✅ " + data.mensaje;
            msg.style.color = "#66ff66";
            document.getElementById('fotoPerfil').src = data.url + "?t=" + Date.now();
            // Actualizar también la foto en la búsqueda de otros clientes si está visible
            const rmOtroDiv = document.getElementById('rmOtroCliente');
            if (rmOtroDiv && rmOtroDiv.innerHTML.includes('d-none') === false) {
                // Si hay una búsqueda activa, recargarla
                const buscarEmail = document.getElementById('buscarEmail').value;
                if (buscarEmail === clienteEmail) {
                    buscarRMCliente();
                }
            }
        } else {
            msg.innerHTML = "❌ " + data.error;
            msg.style.color = "#ff6666";
        }
    } catch (error) {
        console.error('Error:', error);
        msg.innerHTML = "❌ Error de conexión";
        msg.style.color = "#ff6666";
    }
}

// ============================================
// CARGAR PERFIL
// ============================================
async function cargarPerfil() {
    const infoDiv = document.getElementById('info');
    const errorMsg = document.getElementById('errorMsg');
    
    try {
        const response = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: clienteEmail })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            infoDiv.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-user"></i> Nombre</span>
                        <span class="info-value">${data.nombre || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="info-value">${data.email || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-phone"></i> Celular</span>
                        <span class="info-value">${data.celular || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-hospital-user"></i> EPS</span>
                        <span class="info-value">${data.eps || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-tag"></i> Membresía</span>
                        <span class="info-value">${data.membresia_id || 'No asignada'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-calendar-check"></i> Clases restantes</span>
                        <span class="info-value" style="color: #10b981; font-weight: 700;">${data.clases_restantes || 0}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-calendar-alt"></i> Vencimiento</span>
                        <span class="info-value">${data.fecha_vencimiento || 'No registrado'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-circle"></i> Estado</span>
                        <span class="info-value">${data.activo == 'TRUE' ? '<span style="color:#10b981;">✅ Activo</span>' : '<span style="color:#dc2626;">❌ Inactivo</span>'}</span>
                    </div>
                </div>
            `;
            
            // Mostrar foto de perfil si existe, si no mostrar avatar
            if (data.foto_url) {
                document.getElementById('fotoPerfil').src = data.foto_url;
            } else {
                const avatarUrl = generarAvatar(data.nombre, data.email);
                document.getElementById('fotoPerfil').src = avatarUrl;
            }
            
            errorMsg.innerHTML = '';
        } else {
            infoDiv.innerHTML = '';
            errorMsg.innerHTML = '❌ ' + (data.error || 'Error al cargar perfil');
        }
    } catch (error) {
        infoDiv.innerHTML = '';
        errorMsg.innerHTML = '❌ Error de conexión';
        console.error('Error:', error);
    }
}

// ============================================
// CARGAR ANUNCIOS CON IMÁGENES
// ============================================
async function cargarAnuncios() {
    const container = document.getElementById('anunciosContainer');
    try {
        const response = await fetch('/cliente/anuncios');
        const anuncios = await response.json();
        
        if (!anuncios || anuncios.length === 0) {
            container.innerHTML = '<p style="color:var(--text-disabled);">No hay anuncios disponibles</p>';
            return;
        }
        
        let html = '';
        for (const a of anuncios) {
            const imagenHtml = a.imagen_url ? `<img src="${a.imagen_url}" class="anuncio-imagen" alt="Imagen del anuncio">` : '';
            html += `
                <div class="anuncio">
                    <div class="anuncio-titulo">📢 ${a.titulo || 'Sin título'}</div>
                    ${imagenHtml}
                    <div>${a.texto || ''}</div>
                    <div class="anuncio-fecha">📅 ${a.fecha_publicacion || ''}</div>
                </div>
            `;
        }
        container.innerHTML = html;
    } catch (error) {
        container.innerHTML = '<p style="color:#dc2626;">Error al cargar anuncios</p>';
    }
}

// ============================================
// VER RM DE OTRO CLIENTE (CON FOTO)
// ============================================
async function buscarRMCliente() {
    const email = document.getElementById('buscarEmail').value;
    const container = document.getElementById('rmOtroCliente');
    
    if (!email) {
        container.innerHTML = '<p style="color:#dc2626;">❌ Ingresa un email</p>';
        return;
    }
    
    container.innerHTML = '<p><i class="fas fa-spinner fa-pulse"></i> Cargando...</p>';
    
    try {
        const perfilRes = await fetch('/cliente/perfil', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        const perfilData = await perfilRes.json();
        
        if (!perfilRes.ok) {
            container.innerHTML = `<p style="color:#dc2626;">❌ Cliente no encontrado</p>`;
            return;
        }
        
        const rmRes = await fetch(`/cliente/rm/publico?email=${encodeURIComponent(email)}`);
        const rmRecords = await rmRes.json();
        
        // Foto o avatar del cliente buscado
        let fotoHtml = '';
        if (perfilData.foto_url) {
            fotoHtml = `<img src="${perfilData.foto_url}" class="rm-otro-foto" alt="Foto">`;
        } else {
            const iniciales = perfilData.nombre.split(' ').map(p => p[0]).join('').toUpperCase().substring(0, 2);
            fotoHtml = `<div class="rm-otro-avatar">${iniciales}</div>`;
        }
        
        let html = `<div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-top: 10px;">
            <div class="rm-otro-header">
                ${fotoHtml}
                <div>
                    <div style="font-weight: bold; color: var(--primary); font-size: 18px;">🏋️ ${perfilData.nombre}</div>
                    <div style="font-size: 12px; color: var(--text-disabled);">${perfilData.email}</div>
                </div>
            </div>
            <div style="font-weight: bold; margin-bottom: 10px;">Registros (RM):</div>`;
        
        if (rmRecords && rmRecords.length > 0) {
            rmRecords.forEach(r => {
                html += `<div class="rm-item"><strong>${r.habilidad_nombre || 'Desconocido'}</strong>: ${r.peso_kg} kg<span style="font-size: 11px; color: var(--text-disabled);"> (${r.fecha_registro || ''})</span></div>`;
            });
        } else {
            html += `<p>📭 No tiene registros RM aún.</p>`;
        }
        html += `</div>`;
        container.innerHTML = html;
        
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<p style="color:#dc2626;">❌ Error de conexión</p>';
    }
}

// ============================================
// CERRAR SESIÓN
// ============================================
function cerrarSesion() {
    localStorage.removeItem('cliente_email');
    window.location.href = '/cliente/login';
}

// ============================================
// INICIALIZAR
// ============================================
cargarPerfil();
cargarAnuncios();
</script>
</body>
</html>
