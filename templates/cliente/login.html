<!DOCTYPE html>
<html>
<head>
    <title>Cliente - Mi Box CrossFit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- PWA Manifest --> 
    <link rel="manifest" href="/manifest.json">  
</head>
<body>
<div class="card">
    <h2>🏋️ Acceso Atleta</h2>
    <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    <button onclick="login()">Ingresar</button>
    <p id="msg" class="error"></p>
</div>

<script>
async function login() {
    const email = document.getElementById('email').value;
    const msg = document.getElementById('msg');
    
    if (!email) {
        msg.innerText = "❌ Ingresa tu email";
        return;
    }
    
    msg.innerText = "⏳ Verificando...";
    
    try {
        const response = await fetch('/cliente/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Guardar email en localStorage
            localStorage.setItem('cliente_email', email);
            window.location.href = '/cliente/perfil';
        } else {
            msg.innerText = "❌ " + data.error;
        }
    } catch (error) {
        msg.innerText = "❌ Error de conexión";
    }
}
</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
        .then(reg => {
            console.log('✅ SW registrado');
            // Forzar activación
            if (reg.waiting) {
                reg.waiting.postMessage({type: 'SKIP_WAITING'});
            }
        })
        .catch(err => console.log('❌ SW error:', err));
    
    // Asegurar que el SW tome control
    navigator.serviceWorker.ready.then(() => {
        console.log('✅ SW listo');
    });
}
</script>

</body>
</html>
