<!DOCTYPE html>
<html>
<head>
    <title>Cliente - Mi Box CrossFit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#111; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; }
        .card{ background:#1e1e1e; padding:40px; border-radius:25px; width:300px; text-align:center; }
        input{ width:100%; padding:14px; margin:15px 0; border-radius:12px; border:none; }
        button{ width:100%; padding:14px; background:#00aa55; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; }
        .error{ color:#ff6666; margin-top:15px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🏋️ Acceso Atleta</h2>
    <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    <button onclick="login()">Ingresar</button>
    <p id="msg" class="error"></p>
</div>

<script>
async function login() {
    const email = document.getElementById('email').value;
    const msg = document.getElementById('msg');
    
    if (!email) {
        msg.innerText = "❌ Ingresa tu email";
        return;
    }
    
    msg.innerText = "⏳ Verificando...";
    
    try {
        const response = await fetch('/cliente/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Guardar email en localStorage
            localStorage.setItem('cliente_email', email);
            window.location.href = '/cliente/perfil';
        } else {
            msg.innerText = "❌ " + data.error;
        }
    } catch (error) {
        msg.innerText = "❌ Error de conexión";
    }
}
</script>
</body>
</html>
