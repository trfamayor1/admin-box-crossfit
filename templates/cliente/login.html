<!DOCTYPE html>
<html>
<head>
    <title>Cliente - Machine Box CrossFit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos globales -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background: #0C0B10;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        /* Imagen de fondo - se ve completa sin cortes */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/static/images/fondo-login.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0C0B10;
            z-index: 0;
        }
        
        .card {
            background: rgba(18, 17, 24, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            width: 340px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(240, 233, 29, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        .logo {
            margin-bottom: 20px;
        }
        
        .logo i {
            font-size: 48px;
            color: var(--primary);
        }
        
        h2 {
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 24px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        
        input:focus {
            outline: none;
            border: 1px solid var(--primary);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(240, 233, 29, 0.5);
        }
        
        .error {
            color: #ff6666;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Ajustes para móvil */
        @media (max-width: 768px) {
            .card {
                width: 90%;
                max-width: 320px;
                padding: 30px 20px;
            }
            
            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <i class="fas fa-dumbbell"></i>
        </div>
        <h2>🏋️ Acceso Atleta</h2>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
        <button onclick="login()"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
        <p id="msg" class="error"></p>
        <div class="footer">
            <i class="fas fa-shield-alt"></i> Tu entrenamiento, tu progreso
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ SW Cliente registrado'))
                .catch(err => console.log('❌ SW Cliente error:', err));
        }

        async function login() {
            const email = document.getElementById('email').value;
            const msg = document.getElementById('msg');
            
            if (!email) {
                msg.innerText = "❌ Ingresa tu email";
                return;
            }
            
            msg.innerText = "⏳ Verificando...";
            
            try {
                const response = await fetch('/cliente/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('cliente_email', email);
                    window.location.href = '/cliente/perfil';
                } else {
                    msg.innerText = "❌ " + data.error;
                }
            } catch (error) {
                msg.innerText = "❌ Error de conexión";
            }
        }
    </script>
</body>
</html>
